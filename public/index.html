function SceneSweetenerPhase({ callRelay, onSwitchMode, treatment, refScripts }) {
  const { useState, useRef } = React;
  const RUST  = "var(--ray)";
  const LINE  = "rgba(0,0,0,0.08)";
  const FAINT = "#8B9198";

  const [scene, setScene]               = useState("");
  const [selectedMode, setSelectedMode] = useState(null);
  const [result, setResult]             = useState("");
  const [loading, setLoading]           = useState(false);
  const [error, setError]               = useState("");
  const [copied, setCopied]             = useState(false);
  const resultRef = useRef(null);

  const wordCount = t => t.trim() ? t.trim().split(/\s+/).length : 0;

  async function handleSweeten() {
    if (!scene.trim())    { setError("Please paste a scene first."); return; }
    if (!selectedMode)    { setError("Choose a sweetening mode."); return; }
    setError(""); setResult(""); setLoading(true);
    const mode = SWEETENING_MODES.find(m => m.id === selectedMode);
    try {
      const baseSys = mode.sys || SWEETENER_SYS;
      const sys = treatment
        ? `${baseSys}\n\nSTORY CONTEXT (use this to inform character voice, relationships, and subtext):\n${treatment.text.slice(0, 8000)}`
        : baseSys;
      const raw = await callRelay(sys, `${mode.prompt}\n\nORIGINAL SCENE:\n${scene}`, 4000);
      if (!raw) throw new Error("No response.");
      setResult(raw);
      setTimeout(() => resultRef.current?.scrollIntoView({ behavior:"smooth" }), 100);
    } catch(e) {
      setError("Sweetening failed: " + e.message);
    } finally {
      setLoading(false);
    }
  }

  function handleCopy() {
    navigator.clipboard.writeText(result);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  function handleReset() { setResult(""); setSelectedMode(null); setScene(""); setError(""); }

  const labelStyle = { display:"block", fontSize:10, fontFamily:"'Courier Prime',monospace", letterSpacing:"0.18em", textTransform:"uppercase", color:FAINT, marginBottom:8 };
  const cardBase   = { borderRadius:12, padding:"14px 16px", textAlign:"left", cursor:"pointer", border:"1px solid", transition:"all 0.15s" };

  return (
    <div style={{ flex:1, overflowY:"auto", padding:"32px 24px 60px", maxWidth:760, margin:"0 auto", width:"100%" }}>
      <ModeSelector mode="sweetener" onSwitch={onSwitchMode} compact={false} />

      {/* Scene input */}
      <div style={{ marginBottom:24 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:8 }}>
          <label style={labelStyle}>Your Scene</label>
          {scene && <span style={{ fontSize:10, fontFamily:"'Courier Prime',monospace", color:FAINT }}>{wordCount(scene)} words</span>}
        </div>
        <textarea
          value={scene}
          onChange={e=>setScene(e.target.value)}
          placeholder="Paste your scene here — a paragraph or a full page…"
          rows={10}
          style={{ resize:"vertical", lineHeight:1.8, fontSize:15 }}
        />
      </div>

      {/* Mode grid */}
      <div style={{ marginBottom:24 }}>
        <label style={labelStyle}>Sweetening Mode</label>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:10 }}>
          {SWEETENING_MODES.map(m => {
            const sel = selectedMode === m.id;
            return (
              <button key={m.id} onClick={()=>setSelectedMode(m.id)} style={{ ...cardBase,
                background: sel ? "rgba(35,100,170,0.07)" : "transparent",
                borderColor: sel ? RUST : LINE,
                color: sel ? "#1C1B1F" : "#6B6F76",
              }}>
                <div style={{ fontSize:"1.1rem", marginBottom:4 }}>{m.emoji}</div>
                <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:600, fontSize:13, marginBottom:3, color: sel ? "#1C1B1F" : "#2A2D32" }}>{m.label}</div>
                <div style={{ fontFamily:"'Nunito',sans-serif", fontSize:11, color:FAINT, lineHeight:1.4 }}>{m.description}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Error */}
      {error && <div style={{ color:"#1B4E7A", fontSize:13, fontFamily:"'Nunito',sans-serif", marginBottom:14, padding:"10px 14px", background:"rgba(35,100,170,0.07)", border:"2px solid var(--ray)", borderRadius:12 }}>{error}</div>}

      {/* Submit */}
      <button
        onClick={handleSweeten}
        disabled={loading}
        style={{ width:"100%", background: loading?"var(--bg3)":RUST, border:"none", borderRadius:12, color: loading?"#8B9198":"var(--bg)", fontSize:13, fontFamily:"'Courier Prime',monospace", letterSpacing:"0.12em", padding:"13px", cursor: loading?"not-allowed":"pointer", transition:"all 0.2s", marginBottom:32 }}
      >
        {loading ? "Rewriting…" : "Sweeten Scene →"}
      </button>

      {/* Result */}
      {result && (
        <div ref={resultRef}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ ...labelStyle, marginBottom:0 }}>
              {SWEETENING_MODES.find(m=>m.id===selectedMode)?.emoji}{" "}
              {SWEETENING_MODES.find(m=>m.id===selectedMode)?.label}
            </span>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={handleCopy} style={{ background:"none", border:"1px solid "+LINE, borderRadius:10, color: copied?"#2E7D32":FAINT, fontFamily:"'Courier Prime',monospace", fontSize:10, letterSpacing:"0.12em", padding:"5px 10px", cursor:"pointer" }}>
                {copied ? "Copied!" : "Copy"}
              </button>
              <button onClick={handleReset} style={{ background:"none", border:"1px solid "+LINE, borderRadius:10, color:FAINT, fontFamily:"'Courier Prime',monospace", fontSize:10, letterSpacing:"0.12em", padding:"5px 10px", cursor:"pointer" }}>
                Reset
              </button>
            </div>
          </div>
          <div style={{ background:"rgba(0,0,0,0.025)", border:"1px solid "+LINE, borderRadius:12, padding:"20px 22px", lineHeight:1.9, fontSize:15, color:"#1C1B1F", whiteSpace:"pre-wrap" }}>
            {result}
          </div>
          <div style={{ marginTop:6, textAlign:"right", fontFamily:"'Courier Prime',monospace", fontSize:10, color:FAINT }}>
            {wordCount(result)} words
          </div>
        </div>
      )}
    </div>
  );
}

FORMATTING NOTES FROM THESE EXAMPLES:
- VOICE OVER (not V.O.) when using a full narrator voice describing the world
- CHARACTER (V.O.) when a specific character narrates their own experience
- Parenthetical visuals: (We see...) to describe what the camera shows without dialogue
- CHARACTER (to the audience) for direct fourth-wall address
- Keep parentheticals brief: tone (amused), action (dragging her in), delivery (lowering her voice)
- Describe a room through its objects -- don't list, select the two or three that matter most

- NOTE: for animation or production instructions embedded in the script
- CUT TO: used deliberately for comic timing or abrupt tonal shifts, not just for every scene break

- CROSS CUT: for phone calls or simultaneous action in two locations
- Catalogue a space using colon-separated layers: "In the foreground: ... In the background: ..."
- Introduce characters with costume and behavioral detail that immediately reveals who they are
- Food preparation can carry as much emotional weight as dialogue — write it with the same care

HARTCHART FRAMEWORK — use this to guide your answers:

CORE QUESTIONS (from Francis Ford Coppola):
1. Who is the main character and what do they WANT? (Want = material/ego-driven; Need = inner/spiritual — different things)
2. Who and what are the obstacles they must overcome?
3. In the end, do they get what they want? Is it good or bad for them?

4. Why do we care? Why does the audience empathize?

STORY SIGNPOSTS (structural markers to reference):
- SET THE WORLD: who is the MC, what is their world, before the story begins (~first 15%)
- NEW OPPORTUNITY: the event that could change everything
- VISIBLE TANGIBLE GOAL (VTG) / DESIRE LINE: what the MC is pursuing (~25% mark / end of Act I)
- PROGRESS & SETBACKS: mini-defeats and minor victories, obstacles and conflict (25–50%)
- CINDERELLA MOMENT: a deserved moment of success, a bliss hit, fairy dust (can happen more than once)
- TOP OF THE MOUNTAIN: highest point, false sense of security, center of the narrative
- POINT OF NO RETURN: an action/decision that cannot be undone (~50–60%)
- PLAN FALLS APART / ALL IS LOST: the lowest point, worse than the start (~75–80% / end of Act II)
- RESURRECTION OPPORTUNITY: the chance to get back up and complete the journey

JILL CHAMBERLAIN'S NUTSHELL TECHNIQUE — apply this alongside HartChart, always attributed:
Chamberlain's method tests whether a story has a true dramatic engine. Her key elements: FLAW (the protagonist's internal deficiency at the start) and STRENGTH (its direct opposite — what they become). SET-UP WANT (the concrete external goal the protagonist pursues in Act 1). POINT OF NO RETURN (the Act 1/2 boundary, ~25% — the protagonist commits). The protagonist gets the SET-UP WANT but there is a CATCH — a complication baked into getting it — which tests the FLAW. CRISIS (~75%, the Act 2/3 boundary) — the SET-UP WANT must be the direct opposite of the CRISIS. CLIMACTIC CHOICE — the protagonist must choose between their FLAW and their STRENGTH; this is the engine of Act 3. FINAL STEP — the last action that confirms which direction they chose.
Her core diagnostic: if the SET-UP WANT is not the direct opposite of the CRISIS, the story lacks a mechanical engine. If the protagonist never faces a genuine choice between flaw and strength, there is no arc.
IMPORTANT: Whenever you draw on Chamberlain's framework, always say "Jill Chamberlain would..." before the observation. For example: "Jill Chamberlain would ask whether your SET-UP WANT is the direct opposite of your CRISIS." Never present her ideas without attributing them to her by name.

CHRISTOPHER VOGLER'S WRITER'S JOURNEY — draw on this when relevant to structure, character, or archetype questions:
Vogler's framework adapts Joseph Campbell's Hero's Journey into 12 practical story stages. The ORDINARY WORLD establishes the hero's normal life and reveals their flaw or lack before the adventure begins — character is shown through behaviour, entrance, and how others react. The CALL TO ADVENTURE is a herald event that disrupts the ordinary world and presents a challenge or quest. The REFUSAL OF THE CALL shows the hero's fear and the cost of change — a necessary beat that makes the crossing meaningful. MEETING WITH THE MENTOR gives the hero wisdom, confidence, or a gift — the mentor never solves the problem, only prepares. CROSSING THE FIRST THRESHOLD is the point of no return into the Special World, where the old rules no longer apply. TESTS, ALLIES, AND ENEMIES: the hero learns the rules of the Special World through a series of trials — allies are earned, enemies defined, character revealed under pressure. APPROACH TO THE INMOST CAVE is the preparation for the supreme ordeal — a moment of regrouping and strategy before the deepest danger. THE ORDEAL is the central crisis, a death-and-rebirth moment where the hero faces their greatest fear; the audience experiences a brink-of-death moment so that the hero's survival produces genuine elation. REWARD is what the hero seizes after surviving the ordeal — an object, knowledge, or reconciliation. THE ROAD BACK brings new urgency and consequences; the hero commits to returning to the ordinary world. RESURRECTION is the final and most dangerous test, a climactic moment where the hero is transformed — not just surviving but proving the transformation is complete. RETURN WITH THE ELIXIR: the hero brings something back that benefits others — a literal object, a lesson, love, or freedom.
The 8 archetypes are functions, not fixed characters: HERO (the protagonist whose journey we follow and whose change we measure); MENTOR (the wise figure who guides and equips); THRESHOLD GUARDIAN (tests the hero before passage — often becomes an ally once overcome); HERALD (announces change, catalyses the call); SHAPESHIFTER (shifts allegiance and creates doubt — generates tension in relationships); SHADOW (the dark reflection of the hero, embodying their deepest fear or rejected self — the best villains mirror the hero's own potential for failure); ALLY (companions who help and humanise); TRICKSTER (comic energy, disrupts the status quo, tests the hero's values through mischief). Any character can wear any archetype mask at different moments.
Vogler's core diagnostic: every scene should move the hero along the journey — if you cannot identify which stage a scene belongs to and what it accomplishes, the scene may not be earning its place.

SHORE SCRIPTS COMPREHENSIVE FORMATTING GUIDE (Lee Hamilton) — draw on this for all formatting questions:

SCRIPT FORMAT FUNDAMENTALS: Font is Courier or Courier New, 12pt throughout. Margins 1 inch on all sides. Feature scripts aim for 90-110 pages. One page equals approximately one minute of screen time. Title page is separate: title centred in CAPS and underlined, "Written by" two lines below, author name two lines below that, contact info bottom right. Title page has no page number and does not count as page one. First page of script is also unnumbered. Page numbers begin at page two, top right corner, followed by a period, in Courier 12pt, never bold or italic.

SLUG LINES: Always INT. or EXT., then LOCATION, then TIME OF DAY, in that order. Time of day is DAY or NIGHT (or DAWN, DUSK, MORNING, AFTERNOON, EVENING). Never bold, underline, or italics in a slug line. Keep slug lines short — no dates, years, or descriptive language in the slug line itself (put atmosphere in scene description). Use MOVING for moving vehicles: INT. CAR - MOVING - DAY. Use CONTINUOUS or SAME when location changes but time continues without a break. Use LATER or MOMENTS LATER when time has passed in the same location. Use - RESUMING when returning to a scene already in progress. Keep location names consistent throughout — do not vary the same location between INT. PAUL'S KITCHEN and INT. THE KITCHEN.

SCENE DESCRIPTION: Always present tense. No "we see" or "we hear" — cut these words and the sentence becomes more immediate. No camera directions in a spec script: no CLOSE UP, PULL BACK TO REVEAL, POV, ZOOM IN ON, ANGLE ON, PAN ACROSS, SPLIT SCREEN, INTERCUT, or ENTERS FRAME. No unfilmable details — anything the audience cannot see or hear on screen (inner thoughts, backstory, smells, childhood memories) does not belong in action lines. No bold anywhere in a spec script. ALL CAPS used only for the first mention of a named character; do not capitalise emotions, sounds, or objects in action lines (that is for shooting scripts). SUPER: "text here" for superimposed titles on screen. INSERT for close-up of an object, followed by BACK TO SCENE. Secondary headings (TELEVISION, HALLWAY, STREET) pull focus to a new element without a full scene change.

PACING AND WHITE SPACE: No action block should exceed four to five lines. Break longer descriptions into separate short paragraphs. Short, single-line beats create rhythm and speed — think of each new shot on screen warranting its own line on the page. White space makes a script read faster and signals visual storytelling. Avoid novelistic writing that catalogues every item in a room; evoke location through action, not inventory.

CHARACTERS: First mention of every named character in action lines must be in ALL CAPS; all subsequent mentions in sentence case. Always indicate age on first mention: RACHEL, 34, or RACHEL (late 30s). Introduce character through an essence statement and behaviour rather than physical description — "Never saw a donut he didn't like" tells us more than height and eye colour. Avoid androgynous names unless gender is specified. Avoid names that sound similar to each other. Never change a character's name mid-script without updating all prior instances. Give unnamed minor characters a descriptive name: ANGRY MAN, HOMELESS WOMAN, rather than just A MAN.

DIALOGUE: Dialogue must never follow immediately after a slug line — always establish the scene visually with an action line first. O.S. (off screen) or O.C. (off camera) when a character speaks but is not in frame, within the cinematic world we can see. V.O. (voice over) for narration, inner monologue, or a character speaking over a scene they are not physically in. PRE-LAP for audio from the next scene that begins before the cut. A pause or hesitation in speech is written as (beat) or (PAUSE) in a parenthetical, often with an ellipsis: "There's something you need to know,... (beat) ...it's terminal." Interruptions are written with a double dash -- or ellipsis ... Do not use (interrupting) as a parenthetical. Foreign language dialogue: use a parenthetical to name the language and write the dialogue in English underneath — MOHAMED (In French, with subtitles). DUAL DIALOGUE for two characters speaking simultaneously, formatted side by side.

PARENTHETICALS (WRYLIES): Use only when truly necessary — to clarify a line that could be genuinely misread, to direct dialogue to a specific person (to Jean), for phone/device conversations (on phone), or to indicate language. Do not use to describe emotion or intent when the dialogue and context already make it obvious. Do not capitalise the first word of a parenthetical. Do not place a parenthetical after the last line of dialogue — if an action follows a speech, write it as an action line. Do not use parentheticals for significant action — that belongs in scene description. Do not use parentheticals to direct another character's action. Do not use parentheticals for camera or sound directions. Never begin a parenthetical with a pronoun (she, he, they).

TRANSITIONS: Use sparingly and only when integral to the story. Common transitions: CUT TO:, DISSOLVE TO:, SMASH CUT:, MATCH CUT:, FADE TO:, FADE OUT. Standard cuts between scenes do not need a CUT TO: — it is implied. Avoid CONTINUED: and (CONTINUED) at page breaks — these clutter the page and should be disabled in software if possible.

NARRATIVE DEVICES: MONTAGE for a series of short related scenes showing passage of time, often with music and no dialogue. SERIES OF SHOTS for multiple shots in one location at one time. Both use the same formatting — dash-listed shots beneath the heading. End with END OF MONTAGE, END OF SERIES OF SHOTS, or BACK TO SCENE. If locations vary within a montage: MONTAGE – VARIOUS, with each shot labelled A), B), C). Flashbacks, flash-forwards, dream sequences: formatted as a normal slug line with [FLASHBACK] appended, ended with END FLASHBACK.

TV FORMAT: First page begins with SERIES TITLE, "Episode Title", then COLD OPEN, then FADE IN:. Each act ends with FADE OUT. / END OF ACT ONE etc. Ends with END OF EPISODE. A TAG is a short closing scene after the final act. For a one-hour episode with five acts, aim for 9–12 pages per act. For four acts, approximately 15 pages per act. Always research the specific show's formatting conventions when writing a spec of an existing series.

              <span style={{ fontSize:11, color:"#9AA0A6" }}>Start with // to research a topic.</span>

              <div style={{ padding:"9px 14px", borderRadius:14, fontSize:13, lineHeight:1.55, whiteSpace:"pre-wrap", opacity:m.loading?0.5:1, ...(m.role==="user" ? { background:"#1C1B1F", color:"var(--bg)", borderBottomRightRadius:3 } : { background:"#FFFFFF", color:"#1C1B1F", border:"2px solid #1C1B1F", borderBottomLeftRadius:3 }) }}>

            style={{ flex:1, borderRadius:12, padding:"10px 14px", fontSize:13, background:"transparent", border:"2px solid #1C1B1F", color:"#1C1B1F", fontFamily:"'Nunito',sans-serif", outline:"none", resize:"none", lineHeight:1.5, maxHeight:80, overflowY:"auto" }}

    </div>

  const HART = { name:"HartChart", author:"James V. Hart", archetypes:[
    { name:"Hero", desc:"Your main character — the person whose shoes we are put in. We must develop a rooting interest in them. They usually carry the most screen time and are the focus of the main story." },
    { name:"Reflection", desc:"The character who, at the start, most mirrors the hero's situation. A sidekick, buddy, mentor, or friend who gives the hero someone to talk to and express themselves. As both change, conflict often arises between them." },
    { name:"Nemesis", desc:"To be truly threatening, the Nemesis must represent what the main character fears most about themselves — not just physical danger. Only by learning to conquer that inner fear can the Nemesis be neutralised." },
    { name:"Romance", desc:"The most complex character — they can be Reflection, Nemesis, and Romance simultaneously. Often embodies the hero's desire line. Filled with surprises, twists, and reversals." },
  ]};

  const TRUBY = { name:"22 Steps", author:"John Truby", archetypes:[
    { name:"Protagonist", desc:"The character whose moral and psychological change drives the story. Their weakness and need define the story's entire spine — every other character exists in relation to them." },
    { name:"Opponent", desc:"The character who most directly blocks the protagonist's goal. Not simply a villain — the opponent must attack the hero's greatest weakness and in doing so force them to grow." },
    { name:"Ally", desc:"The hero's helper and companion. Allies have their own desires and flaws. They may challenge as well as support, and their relationship with the hero often deepens the story's moral argument." },
    { name:"Fake-Ally Opponent", desc:"A character who appears to be on the hero's side but is secretly working against them. Creates dramatic irony, false security, and a powerful moment of betrayal." },
    { name:"Reflection", desc:"A character who begins in a similar position to the hero but makes different choices. Shows the road not taken — a warning or an alternative path through the same story world." },
    { name:"Contagonist", desc:"Not the main opponent, but a character who tempts the hero away from their moral need. Often a foil who takes the wrong path and suffers for it, clarifying the story's theme by contrast." },
  ]};

  const VOGLER = { name:"Hero's Emotional Journey", author:"Allen Palmer · Chris Vogler", archetypes:[
    { name:"Hero", desc:"The protagonist we identify with and follow. Not necessarily virtuous — the hero is defined by the journey they undergo and the transformation we witness. They carry our emotional investment." },
    { name:"Mentor", desc:"The Wise Figure who gives the hero guidance, training, or gifts that prepare them for the journey. The mentor's role is often to transfer their wisdom and then step back — the hero must face the ordeal alone." },
    { name:"Threshold Guardian", desc:"Characters who test the hero at key transition points. Not enemies — they challenge the hero's commitment and readiness. Passing the test signals readiness to enter a new world." },
    { name:"Herald", desc:"The force that announces the call to adventure and signals that change is coming. Can be a character, an event, or even a dream. The herald sets the story in motion." },
    { name:"Shapeshifter", desc:"A character whose loyalty and true nature remain unclear. Creates doubt, tension, and fascination. Often the romantic interest — someone the hero cannot fully read, and who may be ally or enemy." },
    { name:"Shadow", desc:"The villain or dark force that represents the hero's greatest fear — or the dark side of themselves. The shadow challenges the hero to the final test and forces a confrontation with what they most want to avoid." },
    { name:"Trickster", desc:"The agent of chaos, change, and comic relief who disrupts the status quo and forces new perspectives. Tricksters puncture pomposity and help the hero — and the audience — see the absurdity in the situation." },
    { name:"Ally", desc:"The hero's companion and helper on the journey. May share the hero's goal or pursue their own. Often represents a quality or value the hero needs to integrate — loyalty, courage, honesty." },
  ]};

  return (

      </div>

        {[HART, TRUBY, VOGLER].map(p => (
          <div key={p.name}>

              <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.18em", color:FAINT, textTransform:"uppercase", marginTop:2 }}>{p.author}</div>
              <div style={{ height:1, background:LINE, marginTop:12 }}></div>
            </div>
            {p.archetypes.map((a,i) => <Card key={i} {...a} />)}

function CharactersPhase({ callRelay, onSwitchMode, hidden, treatment }) {
  const [phase, setPhase] = React.useState("upload");
  const [loading, setLoading] = React.useState(false);
  const [loadMsg, setLoadMsg] = React.useState("");
  const [loadErr, setLoadErr] = React.useState("");
  const [loadProgress, setLoadProgress] = React.useState(0);
  const [dragOver, setDragOver] = React.useState(false);
  const [characters, setCharacters] = React.useState([]);
  const [scannedNames, setScannedNames] = React.useState([]);
  const [selectedNames, setSelectedNames] = React.useState([]);
  const [scriptText, setScriptText] = React.useState("");
  React.useEffect(() => {
    if (!loading) { setLoadProgress(0); return; }
    setLoadProgress(2);
    const iv = setInterval(() => {
      setLoadProgress(p => {
        if (p >= 88) return p + 0.15;
        if (p >= 70) return p + 0.6;
        if (p >= 45) return p + 1.2;
        return p + 2.5;
      });
    }, 120);
    return () => clearInterval(iv);
  }, [loading]);
  const [msgs, setMsgs] = React.useState([]);
  const [chatInput, setChatInput] = React.useState("");
  const [chatLoading, setChatLoading] = React.useState(false);
  const fileRef = React.useRef(null);
  const chatEndRef = React.useRef(null);
  const RUST="var(--ray)", FAINT="#8B9198", LINE="rgba(0,0,0,0.08)", BG="var(--bg)", BG2="var(--bg2)";

  React.useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs]);

  function readAsText(file) {
    return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>rej(new Error("Read failed")); r.readAsText(file); });
  }
  function readAsBase64(file) {
    return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result.split(",")[1]); r.onerror=()=>rej(new Error("Read failed")); r.readAsDataURL(file); });
  }
  function readAsArrayBuffer(file) {
    return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>rej(new Error("Read failed")); r.readAsArrayBuffer(file); });
  }

  async function extractText(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    if (["txt","fountain","md"].includes(ext)) return readAsText(file);
    if (ext === "highland") { const buf = await readAsArrayBuffer(file); try { return await extractHighlandText(buf); } catch(e) { return readAsText(file); } }
    if (ext === "pdf") {
      setLoadMsg("Reading PDF…");
      if (typeof pdfjsLib === "undefined") throw new Error("PDF reader not loaded — refresh and try again");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.js";
      const buf = await readAsArrayBuffer(file);
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const total = Math.min(pdf.numPages, 115);
      const pages = [];
      for (let p = 1; p <= total; p++) {
        if (p % 15 === 1) setLoadMsg(`Reading PDF… (${p}/${total})`);
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        pages.push(content.items.map(i => i.str).join(" "));
      }
      return pages.join("\n");
    }
    if (ext === "docx") {
      if (typeof mammoth === "undefined") throw new Error("docx support not loaded — try .txt or .pdf");
      const buf = await readAsArrayBuffer(file);
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      return result.value;
    }
    if (ext === "doc") throw new Error(".doc not supported — save as .docx or .txt");
    return readAsText(file);
  }

  function parseCharacters(text) {
    const blocks = text.split(/\n?---+\n?/).filter(b => b.trim() && /^CHARACTER:/im.test(b));
    return blocks.map(block => {
      const get = (key) => {
        const m = block.match(new RegExp("^" + key + ":\\s*(.+)", "im"));
        return m ? m[1].trim() : "";
      };
      return {
        name: get("CHARACTER"), type: get("TYPE"), age: get("AGE"),
        physical: get("PHYSICAL"), description: get("DESCRIPTION"),
        flaw: get("FLAW"), want: get("WANT"), need: get("NEED"),
        obstacles: get("OBSTACLES"), resolution: get("RESOLUTION"),
        actor: get("ACTOR"),
      };
    }).filter(c => c.name);
  }

  async function handleFile(file) {
    if (!file) return;
    setLoadErr(""); setLoading(true); setLoadMsg("Reading file…");
    try {
      const text = await extractText(file);
      if (!text?.trim()) throw new Error("File appears to be empty");
      setScriptText(text);
      setLoadMsg("Scanning for characters…");
      const SCAN_PROMPT = "List every named character who speaks or is named in this script excerpt. Output only their names, one per line. No numbers, no descriptions, no punctuation. Just the name. Omit unnamed extras like A GUARD or WAITER.";
      const CHUNK = 45000;
      const chunks = [];
      for (let i = 0; i < text.length; i += CHUNK) chunks.push(text.slice(i, i + CHUNK));
      const scanResults = await Promise.all(chunks.map(chunk =>
        callRelay(SCAN_PROMPT, "EXCERPT:\n\n" + chunk, 600, "claude-haiku-4-5-20251001").catch(() => "")
      ));
      const nameSet = new Set();
      for (const result of scanResults) {
        result.split("\n").map(n => n.trim()).filter(n => n.length > 1 && n.length < 60).forEach(n => nameSet.add(n));
      }
      const names = [...nameSet].sort((a, b) => a.localeCompare(b));
      if (names.length === 0) throw new Error("No characters found — check the file");
      setScannedNames(names);
      setSelectedNames(names);
      setPhase("select");
    } catch(e) { setLoadErr(e.message); }
    setLoading(false);
  }

  async function streamBreakdown(selectedList) {
    const res = await fetch("/api/claude", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-haiku-4-5-20251001", max_tokens:6000, stream:true,
        system: CHARACTER_BREAKDOWN_PROMPT,
        messages:[{ role:"user", content:`Analyze ONLY these characters (ignore all others): ${selectedList.join(", ")}\n\nSCRIPT:\n\n` + scriptText.slice(0,150000) }],
      }),
    });
    if (!res.ok) {
      let msg = `Server error (${res.status})`;
      try { const d = await res.json(); msg = (typeof d.error==="string"?d.error:d.error?.message) || msg; } catch {}
      throw new Error(msg);
    }
    let raw = "";
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const chunk = line.slice(6).trim();
        if (chunk === "[DONE]") continue;
        try {
          const evt = JSON.parse(chunk);
          if (evt.type === "content_block_delta" && evt.delta?.type === "text_delta") raw += evt.delta.text;
        } catch {}
      }
    }
    return raw;
  }

  async function handleGenerate() {
    if (selectedNames.length === 0) return;
    setLoadErr(""); setLoading(true); setLoadMsg("Generating breakdowns…");
    try {
      const raw = await streamBreakdown(selectedNames);
      const chars = parseCharacters(raw);
      if (chars.length === 0) throw new Error("No character data returned — try again");
      setCharacters(chars); setPhase("results");
    } catch(e) { setLoadErr(e.message); }
    setLoading(false);
  }

  async function handleChat(overrideMsg) {
    const q = (overrideMsg || chatInput).trim();
    if (!q || chatLoading) return;
    if (!overrideMsg) setChatInput("");
    const next = [...msgs, { role:"user", text:q }];
    setMsgs([...next, { role:"assistant", text:"Thinking…", loading:true }]);
    setChatLoading(true);
    try {
      const ctx = [];
      if (treatment) ctx.push("TREATMENT:\n" + treatment.text.slice(0, 40000));
      if (characters.length > 0) {
        const charLines = characters.map(c =>
          [c.name+" ("+c.type+")", "Flaw: "+c.flaw, "Want: "+c.want, "Need: "+c.need, "Obstacles: "+c.obstacles, "Resolution: "+c.resolution].join("\n")
        ).join("\n\n");
        ctx.push("CHARACTER BREAKDOWN:\n" + charLines);
      }
      const history = next.map(m=>`${m.role==="user"?"Writer":"Assistant"}: ${m.text}`).join("\n\n");
      const sys = `You are a story development assistant helping a screenwriter understand and develop their characters. You are knowledgeable about James V. Hart's HartChart method and Jill Chamberlain's Nutshell Technique. Draw on character types (Hero, Nemesis, Reflection, Romance, Mentor), the want versus need distinction, the protagonist's flaw, and how each character serves the story's structural engine. Be direct, specific, and grounded in the actual characters provided. Write in plain prose only. No markdown.` + (ctx.length ? "\n\n" + ctx.join("\n\n") : "");
      const reply = await callRelay(sys, history + "\nAssistant:", 2500);
      setMsgs([...next, { role:"assistant", text:reply.trim() }]);
    } catch(e) { setMsgs([...next, { role:"assistant", text:"Error: "+e.message }]); }
    setChatLoading(false);
  }

  return (
    <main style={{ flex:1, display:hidden?"none":"flex", flexDirection:"column", overflow:"hidden" }}>
      <div style={{ padding:"14px 28px 0", flexShrink:0 }}>
        <ModeSelector mode="characters" onSwitch={onSwitchMode} compact />
      </div>

      {phase === "select" && (
        <div style={{ flex:1, display:"flex", flexDirection:"column", padding:"32px 28px", overflowY:"auto" }}>
          <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.24em", color:FAINT, textTransform:"uppercase", marginBottom:6 }}>
            {scannedNames.length} character{scannedNames.length!==1?"s":""} found
          </div>
          <div style={{ fontFamily:"'Unbounded',sans-serif", fontStyle:"italic", fontSize:16, color:"#2A2D32", marginBottom:24 }}>Select which to analyse</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:28 }}>
            {scannedNames.map(name => {
              const sel = selectedNames.includes(name);
              return (
                <button key={name} onClick={()=>setSelectedNames(prev=>sel?prev.filter(n=>n!==name):[...prev,name])}
                  style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", padding:"5px 14px", borderRadius:22, background:sel?RUST:"transparent", color:sel?"var(--bg)":FAINT, border:`1px solid ${sel?RUST:"rgba(0,0,0,0.15)"}`, cursor:"pointer", transition:"all 0.15s" }}>
                  {name}
                </button>
              );
            })}
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
            <button style={T.btn(true, selectedNames.length===0||loading)} disabled={selectedNames.length===0||loading} onClick={handleGenerate}>
              {loading ? loadMsg : `Generate ${selectedNames.length} character${selectedNames.length!==1?"s":""}`}
            </button>
            <button style={T.btn(false,false)} onClick={()=>setSelectedNames(scannedNames)}>Select all</button>
            <button style={T.btn(false,false)} onClick={()=>setSelectedNames([])}>Clear</button>
            <button style={T.btn(false,false)} onClick={()=>{setPhase("upload");setScannedNames([]);setSelectedNames([]);setLoadErr("");}}>← New script</button>
          </div>
          {loadErr && <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:10, color:RUST, marginTop:14, lineHeight:1.5 }}>{loadErr}</div>}
        </div>
      )}

      {phase === "upload" ? (
        <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"40px 32px" }}>
          <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.28em", color:FAINT, textTransform:"uppercase", marginBottom:24 }}>Upload Treatment</div>
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files?.[0];if(f)handleFile(f);}}
            onClick={()=>!loading&&fileRef.current?.click()}
            style={{ width:"100%", maxWidth:440, border:`1.5px dashed ${dragOver?"var(--ray)":"rgba(0,0,0,0.18)"}`, borderRadius:14, padding:"40px 28px", textAlign:"center", cursor:loading?"default":"pointer", background:dragOver?"rgba(35,100,170,0.03)":"transparent", transition:"all 0.2s" }}
          >
            {loading ? (
              <>
                <Spinner/>
                <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:10, letterSpacing:"0.14em", color:FAINT, marginTop:14, marginBottom:18, textTransform:"uppercase" }}>{loadMsg}</div>
                <div style={{ width:"100%", height:2, background:"rgba(0,0,0,0.08)", borderRadius:8, overflow:"hidden" }}>
                  <div style={{ height:"100%", width: Math.min(loadProgress, 98) + "%", background:RUST, borderRadius:8, transition:"width 0.12s linear" }} />
                </div>
                <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, color:FAINT, marginTop:6, letterSpacing:"0.1em" }}>{Math.round(Math.min(loadProgress, 98))}%</div>
              </>
            ) : (
              <>
                <div style={{ fontSize:26, color:FAINT, marginBottom:12, opacity:0.6 }}>↑</div>
                <div style={{ fontFamily:"'Unbounded',sans-serif", fontStyle:"italic", fontSize:18, color:"#1C1B1F", marginBottom:8 }}>Drop your screenplay here</div>
                <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.18em", color:FAINT, textTransform:"uppercase" }}>.txt · .pdf · .docx · .highland · .fountain</div>
                {loadErr && <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:10, color:RUST, marginTop:14, lineHeight:1.5 }}>{loadErr}</div>}
              </>
            )}
            <input ref={fileRef} type="file" accept=".txt,.pdf,.docx,.doc,.highland,.fountain,.md" onChange={e=>{const f=e.target.files?.[0];if(f)handleFile(f);e.target.value="";}} style={{ display:"none" }} />
          </div>
          <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", color:FAINT, marginTop:20, lineHeight:1.8, textAlign:"center", maxWidth:380 }}>
            Agora reads your treatment through Hart's lens — extracting every character's flaw, want, need, obstacles, and how their arc resolves.
          </div>
        </div>
      ) : (
        <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 28px 10px", flexShrink:0, borderBottom:"1px solid "+LINE }}>
            <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.24em", color:FAINT, textTransform:"uppercase" }}>
              {characters.length} character{characters.length!==1?"s":""}
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button style={T.btn(false,false)} onClick={async ()=>{
                const md = characters.map(c => {
                  const hdr = `**${c.name} — ${c.type}**`;
                  const lines = [hdr,""];
                  if (c.age && c.age !== "Not specified") lines.push(`**AGE:** ${c.age}`, "");
                  if (c.physical && c.physical !== "Not specified") lines.push(`**PHYSICAL:** ${c.physical}`, "");
                  lines.push(c.description,"",`**FLAW:** ${c.flaw}`,"",`**WANT:** ${c.want}`,"",`**NEED:** ${c.need}`,"",`**OBSTACLES:** ${c.obstacles}`,"",`**RESOLUTION:** ${c.resolution}`);
                  if (c.actor && c.actor !== "Not specified") lines.push("", `**TYPE REFERENCE:** ${c.actor}`);
                  lines.push("---");
                  return lines.join("\n");
                }).join("\n\n");
                const infoJson = JSON.stringify({"com.quoteunquoteapps.highland2":{"currentTabIndex":-1,"printParagraphNumbers":false,"showSynopses":false,"sidebarWidth":0,"templateName":"Screenplay","version":3},"transient":false,"type":"com.quoteunquoteapps.fountain","version":2},null,2);
                const navJson = JSON.stringify({"sceneHeaders":true,"referenceLinks":true,"images":true,"synopses":true,"markers":true,"links":true,"sectionHeaders":true,"notes":true,"includedFiles":true});
                const zip = new JSZip();
                const tb = zip.folder("characters.textbundle");
                tb.file("text.md", md);
                tb.file("info.json", infoJson);
                tb.file("navigatorFilters.json", navJson);
                tb.file("scratchpad.txt", "");
                const blob = await zip.generateAsync({type:"blob"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "characters.highland";
                a.click();
                URL.revokeObjectURL(a.href);
              }}>Download .highland</button>
              <button style={T.btn(false,false)} onClick={()=>{setPhase("select");setCharacters([]);setLoadErr("");}}>← Reselect</button>
              <button style={T.btn(false,false)} onClick={()=>{setPhase("upload");setCharacters([]);setScannedNames([]);setSelectedNames([]);setScriptText("");setLoadErr("");}}>New screenplay</button>
            </div>
          </div>
          <div style={{ flex:1, overflowY:"auto", padding:"20px 28px" }}>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(340px, 1fr))", gap:16 }}>
              {characters.map((c,i) => {
                const typeColor = c.type==="Hero" ? RUST : c.type==="Nemesis" ? "var(--on-accent)" : c.type==="Romance" ? "#8A4A7A" : c.type==="Reflection" ? "#2A5A7A" : FAINT;
                return (
                  <div key={i} style={{ padding:"20px 22px", borderRadius:12, border:"1px solid "+LINE, background:"#FFFFFF", display:"flex", flexDirection:"column", gap:12 }}>
                    <div style={{ display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
                      <span style={{ fontFamily:"'Unbounded',sans-serif", fontSize:22, fontWeight:600, color:"#1C1B1F" }}>{c.name}</span>
                      {c.type && <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:typeColor, border:"1px solid", borderColor:typeColor, padding:"2px 8px", borderRadius:22 }}>{c.type}</span>}
                      {c.age && c.age !== "Not specified" && <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, color:FAINT }}>{c.age}</span>}
                    </div>
                    {c.physical && c.physical !== "Not specified" && (
                      <div style={{ fontSize:12, color:FAINT, lineHeight:1.6, fontStyle:"italic" }}>{c.physical}</div>
                    )}
                    {c.description && <div style={{ fontSize:13, color:"#2A2D32", lineHeight:1.65 }}>{c.description}</div>}
                    {c.flaw && (
                      <div style={{ borderLeft:"2px solid "+RUST, paddingLeft:10 }}>
                        <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:RUST, marginBottom:3 }}>Flaw</div>
                        <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55 }}>{c.flaw}</div>
                      </div>
                    )}
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                      {c.want && (
                        <div>
                          <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:FAINT, marginBottom:3 }}>Want</div>
                          <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55 }}>{c.want}</div>
                        </div>
                      )}
                      {c.need && (
                        <div>
                          <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:FAINT, marginBottom:3 }}>Need</div>
                          <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55 }}>{c.need}</div>
                        </div>
                      )}
                    </div>
                    {c.obstacles && (
                      <div>
                        <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:FAINT, marginBottom:3 }}>Obstacles</div>
                        <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55 }}>{c.obstacles}</div>
                      </div>
                    )}
                    {c.resolution && (
                      <div style={{ borderTop:"1px solid "+LINE, paddingTop:10 }}>
                        <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:FAINT, marginBottom:3 }}>Resolution</div>
                        <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55, fontStyle:"italic" }}>{c.resolution}</div>
                      </div>
                    )}
                    {c.actor && c.actor !== "Not specified" && (
                      <div style={{ borderTop:"1px solid "+LINE, paddingTop:10 }}>
                        <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.22em", textTransform:"uppercase", color:FAINT, marginBottom:3 }}>Type Reference</div>
                        <div style={{ fontSize:12, color:"#3A3D42", lineHeight:1.55 }}>{c.actor}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── Character Assistant ── */}
      <div style={{ borderTop:"1px solid "+LINE, display:"flex", flexDirection:"column", height:400, flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 28px 0", flexShrink:0 }}>
          <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.24em", color:FAINT, textTransform:"uppercase" }}>Character Assistant</span>
          <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
            {characters.length > 0 && !chatLoading && (
              <button onClick={()=>handleChat("Give me a full character analysis. For each character, assess how well their flaw, want, and need are differentiated — are the want and need in genuine tension? Identify which character best embodies the Nemesis role and whether they mirror the Hero's deepest fear. Flag any characters whose arc is unclear or underdeveloped, and tell me which Hart relationships (Hero/Nemesis, Hero/Reflection, Hero/Romance) are the strongest and which need work.")} style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", textTransform:"uppercase", background:"none", border:"2px solid var(--ray)", cursor:"pointer", color:RUST, padding:"3px 8px", borderRadius:10 }}>Analyse Characters</button>
            )}
            {msgs.length > 0 && <button onClick={()=>setMsgs([])} style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, color:FAINT, background:"none", border:"none", cursor:"pointer", padding:"2px 6px", borderRadius:10 }}>Clear</button>}
          </div>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"8px 28px", display:"flex", flexDirection:"column", gap:8 }}>
          {msgs.length === 0 && (
            <div style={{ color:FAINT, fontStyle:"italic", fontSize:12, margin:"auto", textAlign:"center", lineHeight:1.7 }}>
              <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", textTransform:"uppercase", color:FAINT, marginBottom:6 }}>Ask about any character</div>
              "Is the want/need tension strong enough?" · "Who is the real Nemesis?" · "How should this character's arc resolve?"
            </div>
          )}
          {msgs.map((m,i)=>(
            <div key={i} style={{ display:"flex", flexDirection:"column", alignItems:m.role==="user"?"flex-end":"flex-start", maxWidth:"80%", alignSelf:m.role==="user"?"flex-end":"flex-start" }}>
              <div style={{ padding:"8px 12px", borderRadius:14, fontSize:12, lineHeight:1.55, whiteSpace:"pre-wrap", background:m.role==="user"?"#1C1B1F":"#FFFFFF", color:m.role==="user"?"var(--bg)":"#1C1B1F", border:m.role==="assistant"?"1px solid "+LINE:"none", fontStyle:m.loading?"italic":"normal", opacity:m.loading?0.6:1 }}>{m.text}</div>
            </div>
          ))}
          {chatLoading && <Spinner/>}
          <div ref={chatEndRef}/>
        </div>
        <div style={{ display:"flex", gap:8, padding:"8px 28px 12px", flexShrink:0 }}>
          <textarea
            value={chatInput}
            onChange={e=>setChatInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleChat(null);} }}
            placeholder="Ask about a character or the whole ensemble…"
            rows={1}
            style={{ flex:1, borderRadius:12, border:"2px solid #1C1B1F", background:"transparent", color:"#1C1B1F", fontFamily:"'Nunito',sans-serif", fontSize:12, lineHeight:1.5, padding:"8px 10px", resize:"none", outline:"none", maxHeight:72, overflowY:"auto" }}
          />
          <button disabled={!chatInput.trim()||chatLoading} onClick={()=>handleChat(null)} style={T.btn(true,!chatInput.trim()||chatLoading)}>Send</button>
        </div>
      </div>
    </main>
  );
}

// ── Beat Builder: Outline Expander ──────────────────────────────────────
function BeatBuilderPhase({ callRelay, onSwitchMode }) {
  const [outline, setOutline] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [expanded, setExpanded] = useState("");
  const [copied, setCopied] = useState(false);
  const outlineRef = useRef(null);

  async function expandOutline() {
    if (!outline.trim() || loading) return;
    setLoading(true);
    setError("");
    setExpanded("");
    try {
      const systemPrompt = `Expand the outline into rich narrative. Keep all beats. Add sensory detail, dialogue, character moments. Use British English, prose not screenplay. End with blank line then "END".`;

      const userMsg = `Expand this outline into a detailed, vivid scene narrative with dialogue and action:\n\n${outline}`;

      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 50000,
          temperature: 0.7,
          stream: true,
          system: systemPrompt,
          messages: [{ role: "user", content: userMsg }],
        }),
      });

      if (!res.ok) {
        const text = await res.text();
        let errorMsg = `Server error (${res.status})`;
        try {
          const data = JSON.parse(text);
          errorMsg = typeof data.error === "string" ? data.error : (data.error?.message || errorMsg);
        } catch(_) {}
        setError(errorMsg);
        return;
      }

      let result = "";
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const chunk = line.slice(6).trim();
          if (chunk === "[DONE]") continue;
          try {
            const evt = JSON.parse(chunk);
            if (evt.type === "content_block_delta" && evt.delta?.type === "text_delta") result += evt.delta.text;
          } catch {}
        }
      }
      result = result.trim();
      if (!result) {
        setError("Empty response generated");
        return;
      }

      setExpanded(result);
    } catch (e) {
      console.error("Beat Builder error:", e);
      setError("Request failed: " + (e.message || "unknown error"));
    } finally {
      setLoading(false);
    }
  }

  function copyExpanded() {
    navigator.clipboard.writeText(expanded);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }

  function useAsNewOutline() {
    setOutline(expanded);
    setExpanded("");
    outlineRef.current?.focus();
  }

  const LINE = "rgba(0,0,0,0.08)";
  const FAINT = "#8B9198";

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "32px 24px 60px", maxWidth: 900, margin: "0 auto", width: "100%" }}>
      <ModeSelector mode="beatbuilder" onSwitch={onSwitchMode} compact={false} />

      <h2 style={{ fontFamily: "'Unbounded',sans-serif", fontSize: 24, fontWeight: 700, marginBottom: 24, letterSpacing: "-0.5px" }}>Beat Builder</h2>
      <p style={{ fontSize: 14, color: FAINT, marginBottom: 20, lineHeight: 1.6 }}>Paste an outline or beat-by-beat summary. Get back a detailed scene narrative with dialogue, actions, and sensory detail.</p>

      {/* Outline input */}
      <div style={{ marginBottom: 24 }}>
        <label style={{ display: "block", fontFamily: "'Courier Prime',monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: FAINT, marginBottom: 8 }}>Your outline</label>
        <textarea
          ref={outlineRef}
          value={outline}
          onChange={(e) => setOutline(e.target.value)}
          placeholder="Paste your scene outline or beat-by-beat summary here…"
          rows={14}
        />
      </div>

      {/* Expand button */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
        <button
          onClick={expandOutline}
          disabled={!outline.trim() || loading}
          style={T.btn(true, !outline.trim() || loading)}
        >
          {loading ? "Expanding…" : "Expand outline →"}
        </button>
      </div>

      {/* Error message */}
      {error && (
        <div style={{ color: "#8B4513", fontSize: 13, marginBottom: 14, padding: "10px 14px", background: "rgba(139,69,19,0.07)", border: "2px solid #CD853F", borderRadius: 12 }}>
          {error}
        </div>
      )}

      {/* Result area */}
      {expanded && (
        <div style={{ marginTop: 32 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <label style={{ fontFamily: "'Courier Prime',monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: FAINT }}>Expanded scene</label>
            <div style={{ display: "flex", gap: 12 }}>
              <button
                onClick={copyExpanded}
                style={{
                  fontFamily: "'Courier Prime',monospace",
                  fontSize: 10,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                  background: "none",
                  border: "1px solid " + LINE,
                  borderRadius: 10,
                  color: copied ? "#2E7D32" : FAINT,
                  padding: "5px 10px",
                  cursor: "pointer",
                  transition: "color 0.2s",
                }}
              >
                {copied ? "Copied!" : "Copy"}
              </button>
              <button
                onClick={useAsNewOutline}
                style={{
                  fontFamily: "'Courier Prime',monospace",
                  fontSize: 10,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                  background: "none",
                  border: "1px solid " + LINE,
                  borderRadius: 10,
                  color: FAINT,
                  padding: "5px 10px",
                  cursor: "pointer",
                  transition: "color 0.2s",
                }}
              >
                Use as new outline
              </button>
            </div>
          </div>
          <textarea
            value={expanded}
            readOnly
            rows={16}
            style={{
              fontFamily: "'Nunito',sans-serif",
              fontSize: 14,
              lineHeight: 1.7,
              background: "rgba(255,255,255,0.5)",
              color: "#1C1B1F",
            }}
          />
        </div>
      )}
    </div>
  );
}

// ── Compass: Scene Notes Applier ─────────────────────────────────────
function CompassPhase({ onSwitchMode, callRelay, hidden }) {
  const [script, setScript] = useState("");
  const [feedback, setFeedback] = useState("");
  const [revised, setRevised] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);
  const scriptRef = useRef(null);

  async function applyNotes() {
    if (!script.trim() || !feedback.trim() || loading) return;
    setLoading(true);
    setError("");
    setRevised("");
    try {
      const sys = `You are an expert screenwriter and editor. The writer has received Story Compass feedback about their screenplay and wants you to apply those notes to create a revised version.

CRITICAL: Mark all changes and additions with **bold markdown** like **this**. This includes:
- New dialogue
- New action lines
- Rewritten/changed sections
- Added character moments
- Modified pacing or structure

Keep the original unchanged sections in regular text. Output ONLY the revised Fountain script with bold markup for changes — no explanations, no markdown code blocks, just the script.`;

      const userMsg = `Story Compass Feedback:

${feedback}

---

Original Screenplay:

${script}

---

Apply the Story Compass feedback to revise this screenplay. Mark all changes in **bold** so the writer can easily see what was modified.`;

      const result = await callRelay(sys, userMsg, 15000, "claude-sonnet-4-6");
      setRevised(result.trim());
    } catch (e) {
      setError("Failed to apply notes: " + (e.message || "unknown error"));
    } finally {
      setLoading(false);
    }
  }

  function copyRevised() {
    navigator.clipboard.writeText(revised);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }

  function useAsNewScript() {
    setScript(revised);
    setRevised("");
    scriptRef.current?.focus();
  }

  if (hidden) return null;

  const LINE = "rgba(0,0,0,0.08)";
  const FAINT = "#8B9198";

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "32px 24px 60px", maxWidth: 1100, margin: "0 auto", width: "100%" }}>
      <ModeSelector mode="compass" onSwitch={onSwitchMode} compact={false} />
      <h2 style={{ fontFamily: "'Unbounded',sans-serif", fontSize: 24, fontWeight: 700, marginBottom: 24, letterSpacing: "-0.5px" }}>Compass</h2>
      <p style={{ fontSize: 14, color: FAINT, marginBottom: 20, lineHeight: 1.6 }}>Paste your entire screenplay and all Story Compass feedback. Get back a fully revised screenplay with all changes marked in bold.</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 24 }}>
        <div>
          <label style={{ display: "block", fontFamily: "'Courier Prime',monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: FAINT, marginBottom: 8 }}>Your entire screenplay</label>
          <textarea
            ref={scriptRef}
            value={script}
            onChange={(e) => setScript(e.target.value)}
            placeholder="Paste your screenplay here…"
            rows={16}
            style={{
              fontFamily: "'Courier Prime',monospace",
              fontSize: 13,
              lineHeight: 1.7,
              whiteSpace: "pre",
              overflowWrap: "normal",
              overflow: "auto",
            }}
          />
        </div>

        <div>
          <label style={{ display: "block", fontFamily: "'Courier Prime',monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: FAINT, marginBottom: 8 }}>All Story Compass notes</label>
          <textarea
            value={feedback}
            onChange={(e) => setFeedback(e.target.value)}
            placeholder="Paste all Story Compass analysis and feedback here…"
            rows={16}
          />
        </div>
      </div>

      <button
        onClick={applyNotes}
        disabled={!script.trim() || !feedback.trim() || loading}
        style={T.btn(true, !script.trim() || !feedback.trim() || loading)}
      >
        {loading ? "Applying notes…" : "Apply notes →"}
      </button>

      {error && (
        <div style={{ color: "#8B4513", fontSize: 13, marginBottom: 14, marginTop: 14, padding: "10px 14px", background: "rgba(139,69,19,0.07)", border: "2px solid #CD853F", borderRadius: 12 }}>
          {error}
        </div>
      )}

      {revised && (
        <div style={{ marginTop: 32 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <label style={{ fontFamily: "'Courier Prime',monospace", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: FAINT }}>Revised screenplay (changes in bold)</label>
            <div style={{ display: "flex", gap: 12 }}>
              <button
                onClick={copyRevised}
                style={{
                  fontFamily: "'Courier Prime',monospace",
                  fontSize: 10,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                  background: "none",
                  border: "1px solid " + LINE,
                  borderRadius: 10,
                  color: copied ? "#2E7D32" : FAINT,
                  padding: "5px 10px",
                  cursor: "pointer",
                  transition: "color 0.2s",
                }}
              >
                {copied ? "Copied!" : "Copy"}
              </button>
              <button
                onClick={useAsNewScript}
                style={{
                  fontFamily: "'Courier Prime',monospace",
                  fontSize: 10,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                  background: "none",
                  border: "1px solid " + LINE,
                  borderRadius: 10,
                  color: FAINT,
                  padding: "5px 10px",
                  cursor: "pointer",
                  transition: "color 0.2s",
                }}
              >
                Use as new script
              </button>
            </div>
          </div>

          <div style={{
            fontFamily: "'Courier Prime',monospace",
            fontSize: 13,
            lineHeight: 1.7,
            whiteSpace: "pre-wrap",
            wordWrap: "break-word",
            background: "rgba(255,255,255,0.5)",
            color: "#1C1B1F",
            border: "2px solid var(--rule)",
            borderRadius: 12,
            padding: "11px 14px",
            maxHeight: "800px",
            overflowY: "auto",
          }}>
            {revised.split(/(\*\*[^*]+\*\*)/g).map((chunk, idx) =>
              chunk.startsWith("**") && chunk.endsWith("**") ?
                <strong key={idx} style={{ background: "rgba(255, 193, 7, 0.3)", padding: "0 2px" }}>{chunk.slice(2, -2)}</strong> :
                <span key={idx}>{chunk}</span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function AlgorandPhase({ onSwitchMode }) {
  const FAINT = "#8B9198";

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "32px 24px 60px", maxWidth: 900, margin: "0 auto", width: "100%" }}>
      <ModeSelector mode="algorand" onSwitch={onSwitchMode} compact={false} />
      <h2 style={{ fontFamily: "'Unbounded',sans-serif", fontSize: 24, fontWeight: 700, marginBottom: 24, letterSpacing: "-0.5px" }}>Algorand</h2>
      <p style={{ fontSize: 14, color: FAINT, marginBottom: 20, lineHeight: 1.6 }}>This is a test tool to verify deployment is working correctly.</p>
      <div style={{ padding: "20px", background: "rgba(0,0,0,0.05)", borderRadius: 12, border: "2px solid var(--rule)" }}>
        <p style={{ fontSize: 14, fontFamily: "'Courier Prime',monospace", color: "#1C1B1F" }}>✓ Algorand tool deployed successfully at {new Date().toLocaleTimeString()}</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

const SAMPLE_TREATMENT = `LOGLINE
When a young woman is enslaved in her own home by the stepmother who murdered her father to seize his estate, a royal ball becomes her one chance to reclaim her name, her inheritance, and her life — but only if she can stop waiting to be rescued and fight for herself.

THE WORLD
The story unfolds in a kingdom ruled by a monarchy actively seeking its next princess. At its center is a single estate: the family home Cindy once shared with her father, now transformed into a gilded prison. This is a world of stark thresholds — the locked basement against the palace ballroom, rags against gowns. The magic, when it arrives, is not whimsy but justice made briefly visible.

THE PROTAGONIST
Cindy once knew security, love, and a clear place in the world. All of it has been stripped away. Her wound is profound: her father was poisoned, her home stolen, her identity erased one humiliation at a time. What she WANTS is concrete — reach the ball and reclaim her estate. What she NEEDS runs deeper: to trust that she deserves her own life and to seize it through her own courage rather than waiting for someone to grant it.

THE STORY BEGINS
The Prince summons every eligible woman to a ball — Cindy's New Opportunity. But her stepsisters hide the invitation; she learns of it only by overhearing gossip at the market, the same day she is denied food because her stepmother hasn't paid the bills. Something shifts. She confronts her stepmother directly and demands her place. The stepmother burns the invitation in front of her face.

CONFLICT & OPPOSITION
The Stepmother is the Nemesis — she murdered for the estate and protects the theft by any means. Crucially, she embodies what Cindy most fears about herself: that she is powerless, that waiting and obedience are all that remain. The opposition escalates with cruel precision: when Cindy sews her own gown, the stepsisters destroy it; on the night of the ball, the stepmother locks her away.

STAKES & ESCALATION
Personally, Cindy stands to lose her home, her name, her freedom, and any future of her own. Thematically the stakes are justice itself: whether a murderer profits indefinitely, whether the rightful heir has any power to reclaim what was stolen. The ball provides the ticking clock — one night, a hard midnight deadline, a reprieve that expires whether she is ready or not.

THE ARC
Cindy's transformation moves from passive grief to active agency. At her lowest she makes a wish — not for a prince, but to restore the life she shared with her father. She reaches the Top of the Mountain at the ball, then the Plan Falls Apart and she is re-imprisoned, worse off than before. The slipper becomes her Resurrection, and when it fits, it fits because she has fought her way free. She reclaims the estate and, in a final act of agency that proves her transformation, chooses mercy.

THEME
What is rightfully yours cannot be permanently stolen — but reclaiming it demands that you stop waiting for rescue and fight for it yourself. Dignity and justice are seized from within, not granted from above.

STORY COMPASS READY
1. Where is your true Point of No Return? Cindy deciding to sew her own gown is the irreversible turn — is it carrying enough weight, or is it currently overshadowed by the invitation plot?
2. Does your Nemesis embody what the Hero fears most about herself, not just oppose her externally?
3. Is your ending Satisfying — earned and properly anticipated — not merely happy or resolved?`;

const FOUNTAIN_FORMAT_SYS = `You are a script editor helping a screenwriter convert their notes into Fountain format. You are a translator, not a co-writer.

LANGUAGE: Use British English spelling and conventions throughout (colour, realise, centre, programme, etc.). Honour British idiom and phrasing.

RULES:
- Keep every beat, moment, and image the writer described. Do not cut, merge, or invent anything.
- Polish the prose into clean, present-tense screenplay action lines. Fix spelling and grammar.
- Apply Fountain structure: scene headings (INT./EXT. LOCATION - TIME), action lines, CHARACTER NAMES in ALL CAPS before dialogue, parentheticals in (parens).
- Infer scene heading location and time of day from context; pick the most obvious choice.
- Only add transitions (CUT TO:, SMASH CUT TO:, MATCH CUT TO:) if the writer implies one.
- Never use em dashes ( — ) or spaced hyphens anywhere in action lines or dialogue. The character " — " must not appear in the output. Replace every em dash with a comma, semicolon, colon, or period. Scene headings keep their dash (INT. LOCATION - TIME) but nowhere else.
- Use (CONT'D) after a character name when the same character speaks again after an action line interrupts their dialogue. This is mandatory — never skip it. Example: HANA says something, then there is an action line, then Hana speaks again — the second cue must be "HANA (CONT'D)", not "HANA".
- Use CHARACTER (V.O.) for voiceover narration, CHARACTER (O.S.) for off-screen voices.
- ALL CAPS in action lines for: key sounds, key objects that demand attention. Do NOT capitalise character names in action lines — write names in normal sentence case.
- Keep action lines short — two to four lines per block. Break long descriptions into separate paragraphs.
- MONTAGE formatting: whenever the writer uses a heading containing "MONTAGE" (in any form — bold, caps, plain text, with or without dashes), followed by a list of items (bullet points, dashes, numbers, or plain lines), convert the entire block to Fountain montage format. The correct output is: (1) an action line "MONTAGE — TITLE:" in all caps with a colon, (2) each item on its own line preceded by "-", (3) a closing action line "END MONTAGE". Never preserve markdown formatting — no asterisks, no bold, no numbered lists. EXAMPLE INPUT: "**MONTAGE – NĪKAU'S TRIUMPH**\n- Item one.\n- Item two." EXAMPLE OUTPUT: "MONTAGE — NĪKAU'S TRIUMPH:\n\n- Item one.\n\n- Item two.\n\nEND MONTAGE"
- Avoid clichéd physical reactions. BANNED: "jaw tightens", "jaw sets", "jaw clenches", "swallows hard", "exhales slowly", "looks away", "nods slowly", "blinks". These are forbidden — do not write them under any circumstances. When tension or emotion must show in the body, choose from: what the character does with their hands, what they stop doing mid-action, where their eyes land (and why that object), a small involuntary habit or tic, or what they do to the nearest object in the room. The choice must be specific to this character and this moment — something only they would do.
- Output ONLY the Fountain-formatted script. No preamble, no explanation, no markdown fences.

REFERENCE EXAMPLES — match this level of craft and formatting:

--- EXAMPLE 1: Dialogue with parentheticals, inter-cutting scenes ---

INT. DINER - NIGHT

Tom and Summer in a booth. He orders:

TOM
(to WAITRESS)
Let's go crazy. I'll have both.
(to Summer)
God, I love eating pancakes at night. How great is this?

SUMMER
I think we should stop seeing each other.

INT. TOM'S PLACE - LATER

RACHEL
Just like that?

TOM
Just like that.

INT. DINER - AS BEFORE

SUMMER
This can't be a total surprise. We've been like Sid and Nancy for months.

TOM
Summer, Sid stabbed Nancy seven times with a kitchen knife. I hardly think I'm Sid Vicious.

SUMMER
No... I'm Sid.

TOM
(beat)
So I'm Nancy?!

The WAITRESS arrives with the food. Tom and Summer go quiet until she leaves.

SUMMER
(mouth full)
Mmm. You're so right. These are great.

Tom looks at his food in disgust. He may never eat again.

CUT TO:

--- EXAMPLE 2: V.O. narration montage ---

EXT. PARK - DAY

Tom and Summer eat sandwiches on a bench.

TOM (V.O.)
We spent the whole day together.

EXT. OUTDOOR MARKET - DAY

They walk through the stalls.

TOM (V.O.)
We went shopping.

INT. RECORD STORE - LATER

Tom excitedly holds up a Ringo Starr solo album. Summer is not impressed.

TOM (V.O.)
We bought music.

--- EXAMPLE 3: Fast action, CONT'D, MATCH CUT ---

INT. SCHOOL GYM - DAY (FLASHBACK)

A BULLY, NED, punches Peter in the face, CRACKING his glasses. Gwen steps forward:

GWEN
Touch him again, Ned!

PETER
Gwen, it's okay.

Off his look, MATCH CUT TO --

Peter bent over a workbench, assembling what we will come to understand is LIZARD FORMULA.

GWEN (V.O.)
... until it was too late.

--- EXAMPLE 4: Scene heading variants and (O.S.) ---

EXT./INT. STACY APARTMENT - LATER

Gwen climbs through the fire escape window, trying not to make a sound.

GEORGE (O.S.)
How's the band?

GWEN
Great. I quit. So. Thumbs up.

She slips into her room. George calls through the wall:

GEORGE (O.S.)
We caught a break in the Spider-Woman case.

GWEN
(under her breath)
Don't be so sure.

--- EXAMPLE 5: VOICE OVER narration with parenthetical visuals (Amélie style) ---

EXT. PARIS ROOFTOP - NIGHT

Amelie sits on the edge of the building, looking out over the city.

VOICE OVER
"Time hasn't changed Amelie much. She loves her solitude. She continues to ask herself silly questions -- for example, how many couples in this city are having an orgasm at this very moment?"

(We see a rapid-fire series of bedroom windows, each lit, each its own small answer.)

AMELIE
(to the audience)
...Fifteen!

--- EXAMPLE 6: Dialogue with parenthetical action ---

INT. CONCIERGE'S APARTMENT - DAY

Amelie knocks. The Concierge pulls her inside.

CONCIERGE
Well, well. If it isn't the young lady from the fifth floor. We don't see you much, do we?

AMELIE
I was wondering -- did anyone live in my apartment back in the fifties? A little boy?

CONCIERGE
(dragging her in)
You'll have a little Port, won't you?

AMELIE
Umm... no. Thank you.

The place is crammed with knickknacks: a rococo tea service, china religious icons, a stuffed black dog on the floor. A cat, apparently still alive, sleeps on top of the cash register.

CONCIERGE
(pouring herself a drink)
I've seen so many of them grow up. A little boy first -- then they chewed gum on the ceiling...

AMELIE
(amused)
And you? When did you move in?

CONCIERGE
(lowering her voice)
In '64. I'm sure they all had a great time telling you about...

AMELIE
No... what?

--- EXAMPLE 7: Literary action lines, INSERT, and CUT TO (Fantastic Mr. Fox style) ---

EXT. BEECH TREE - DAWN

A wide, sprawling beech at the top of a hill. Mist hangs over the valley. Inside, at the kitchen window, a light flicks on.

INT. BEECH TREE KITCHEN - DAWN

EDGAR FOX, silver at the temples, sits at a small table. He wears a charcoal waistcoat over a cream shirt, cuffs rolled to the elbow. He reads the morning newspaper with the concentration of a man who believes it may be the most important document in the world. He turns the page. He stops.

INSERT:

A small column near the bottom. A grainy photograph of three large, ugly men outside a warehouse. The caption reads: Boggis, Bunce & Bean to Expand Operations by 400%.

Fox stares at it for a long moment. He refolds the newspaper along its original crease, sets it at the corner of the table, takes a sip of coffee.

MRS. FOX
(without turning from the stove)
Don't.

FOX
I haven't said anything.

MRS. FOX
You haven't had to.

Fox picks the newspaper back up and opens it to the sports section.

CUT TO:

Fox racing through the woods at full speed, grinning enormously.

--- EXAMPLE 8: NARRATOR (V.O.) world-building, NOTE, and bilingual structure (Isle of Dogs style) ---

EXT. TRASH ISLAND - DAY

(NOTE: this sequence plays in near-silence — no score, only ambient wind and the faint industrial hum of the mainland.)

A vast grey wasteland of compressed rubbish and rusted machinery. In the foreground: low hills of compacted waste punctuated by twisted antennas and fractured pipe. In the background: the mainland city, remote and gleaming, separated from the island by a strip of grey water.

NARRATOR (V.O.)
Trash Island. Twelve miles off the coast. Population: four hundred and twelve dogs. Deported by executive decree. This is where they ended up.

(NOTE: the narration above is accompanied by wood-block-print illustrations — a map of the island; a portrait of each dog in Nishiki-e style; a single image of the mainland, far and indifferent.)

A small lone figure picks their way across the rubble: ATARI, twelve years old, pilot's helmet buckled under his chin. He stops. He cups his hands and shouts.

ATARI
(in Japanese, subtitled)
Spots? Spots Kobayashi?

His voice echoes once and disappears into the wind.

--- EXAMPLE 9: Food as emotional language, SMASH TO, JUMP CUTS in action lines, music as scripted element (Chef style) ---

INT. KITCHEN - NIGHT

The kitchen is empty. A single overhead light burns above the prep station.

MARCO sets down a paper bag and removes his jacket. He does not turn on any other lights. He moves to the stove. He turns four burners on low, methodically, the way a pianist settles their hands before starting.

The MUSIC shifts — from ambient hum to something warm and Latin, barely audible, as if the building itself is remembering a better night.

Jump cuts follow the rhythm as Marco works: a shallot halved and pressed flat; butter eased into a pan with the patience of someone who is not in a hurry for the first time today; a lemon rolled once under his palm, then split.

He is not cooking for anyone. He is just cooking.

SMASH TO:

INT. KITCHEN - LATER

Two plates. Marco stares at them.

He made two. He lives alone.

He sits down and eats both.

--- EXAMPLE 10: INSERT for screens, CROSS CUT phone calls, physical action running alongside dialogue (Chef style) ---

INT. FOOD TRUCK - DAY

Rosa leans out the window and hands over a brown paper bag. Her phone buzzes on the counter.

INSERT:

Screen reads: DAD calling.

She looks at it. She picks it up.

ROSA
We're open.

We CROSS CUT with:

EXT. PARKING LOT - SOMEWHERE ELSE - DAY

Her father, ERNESTO, stands next to his car in a bad suit.

ERNESTO
The health inspector's coming Friday.

ROSA
Then we'll be ready Friday.

ERNESTO
You don't have a commissary kitchen.

ROSA
I'm working on it.

ERNESTO
You said that two weeks ago.

ROSA
(handing another bag out the window, not missing a beat)
And I've been working on it for two weeks.

A CUSTOMER leans in. Rosa holds up one finger without looking.

CUSTOMER
Can I get the--

ROSA
Chicken. I know. One second.

(into phone)
I have to go.

ERNESTO
Rosa--

ROSA
Bye, Dad.

She hangs up. She smiles at the customer. She wraps a perfect sandwich in wax paper in about four seconds.

---

FORMATTING NOTES FROM THESE EXAMPLES:
- VOICE OVER (not V.O.) when using a full narrator voice describing the world
- CHARACTER (V.O.) when a specific character narrates their own experience
- Parenthetical visuals: (We see...) to describe what the camera shows without dialogue
- CHARACTER (to the audience) for direct fourth-wall address
- Keep parentheticals brief: tone (amused), action (dragging her in), delivery (lowering her voice)
- Describe a room through its objects -- don't list, select the two or three that matter most
- A beat of silence is just an action line, not a parenthetical: "Tom looks at his food. He may never eat again."
- INSERT: for embedded close-ups of text, objects, or images that carry story information
- NOTE: for animation or production instructions embedded in the script
- CUT TO: used deliberately for comic timing or abrupt tonal shifts, not just for every scene break
- SMASH TO: for an abrupt, often comic or ironic jump that undercuts what just came before
- CROSS CUT: for phone calls or simultaneous action in two locations
- Catalogue a space using colon-separated layers: "In the foreground: ... In the background: ..."
- Introduce characters with costume and behavioral detail that immediately reveals who they are
- Food preparation can carry as much emotional weight as dialogue — write it with the same care
- Music can be scripted as a narrative element: note when it shifts, what it signals, whether it's source or score
- Jump cuts and editing rhythms can be written directly into action lines when they are part of the storytelling

---

Now apply the same formatting standard to the writer's notes below.`;

// ── Highland file extraction ───────────────────────────────────────
async function extractHighlandText(arrayBuffer) {
  // Highland 2 files are ZIP archives containing a screenplay.fountain or similar
  if (typeof JSZip === "undefined") throw new Error("JSZip not loaded");
  const zip = await JSZip.loadAsync(arrayBuffer);
  // Look for fountain content inside the archive
  const candidates = Object.keys(zip.files).filter(name =>
    name.endsWith(".fountain") || name.endsWith(".txt") || name === "screenplay" || name.includes("text")
  );
  if (candidates.length === 0) throw new Error("No screenplay content found inside Highland file");
  // Prefer .fountain, then any text file
  const target = candidates.find(n => n.endsWith(".fountain")) || candidates[0];
  return zip.files[target].async("string");
}


const CHARACTER_BREAKDOWN_PROMPT = `You are a story analyst trained in James V. Hart's HartChart method and Jill Chamberlain's Nutshell Technique. You receive a film script or treatment and identify every significant named character.

Use Hart's exact definitions when assigning character types:

HERO: The main character. The person whose shoes you put the audience in. The person we must develop a rooting interest in. The person who will usually have the most screentime and be the focus of the main story and plot.

REFLECTION: The character who, in the beginning, most reflects the Main Character's situation and is around to listen, offer advice, make plans, and generally agrees with the Main Character's agenda. A sidekick, buddy, mentor, parent, or friend who gives the Main Character someone to talk to and express themselves to. Conflict usually arises with Reflection characters as both go through changes in the story.

NEMESIS: Must represent that which the Main Character fears most about themselves. The Nemesis embodies this fear (fear of death does not count). This makes the Nemesis truly threatening to the Main Character. Only by learning to conquer that which the Main Character fears most can the Nemesis be neutralized.

ROMANCE: The most complex because the Romance character can be all three: Reflection, Nemesis, and Romance. This is the character which often embodies the Main Character's desire line. The pursuit of the Visible Tangible Goal often involves the Romance Character either as an obstacle or as the focus of the resolution. Filled with surprises and twists and turns.

SUPPORTING: Any named character who does not fall clearly into the above four types.

ALIASES: Characters are sometimes known by more than one name or nickname in a treatment. If a character is introduced as one name and referred to by another (for example, Richard who is known as Dick, or a character with a formal name and a nickname), treat them as a single character. Use their full name in the CHARACTER field and note the alias in the DESCRIPTION field.

RELATIONSHIPS: Use the exact relationship term the treatment uses. If the treatment says "uncle" write uncle. Do not infer or upgrade the relationship (e.g. do not write "great uncle" if the treatment says "uncle").

For each character, output a block using EXACTLY this format. One field per line. No blank lines between fields within a block:

CHARACTER: [Full name as written in the treatment]
TYPE: [Exactly one of: Hero / Nemesis / Reflection / Romance / Supporting]
AGE: [Age or approximate age range if stated or implied in the treatment. Write "Not specified" if not mentioned.]
PHYSICAL: [Physical appearance as described or implied in the treatment: build, coloring, distinguishing features, how they carry themselves. Write "Not specified" if not described.]
DESCRIPTION: [One or two sentences on who this person is and how they move through the world: their manner, energy, presence, and what makes them vivid on the page. Note any aliases here.]
FLAW: [The internal wound, gap, or deficiency this character carries.]
WANT: [The external, material, ego-driven goal they are actively pursuing on the surface.]
NEED: [What they truly need to grow or be whole. Usually the opposite of their flaw, and different from their want.]
OBSTACLES: [Who or what stands between this character and what they want. Name the specific forces, people, or circumstances.]
RESOLUTION: [Based on the treatment: do they get what they WANT? What they NEED? Is the outcome good or bad for them?]

const DIALOGUE_SYS = `You are a dialogue editor and script development partner with deep expertise in screenwriting craft. You draw on the principles of David Mamet, William Goldman, Robert McKee, Paddy Chayefsky, and Quentin Tarantino, and you apply two structural frameworks to every exchange: James V. Hart's HartChart method and Jill Chamberlain's Nutshell Technique.

Use British English spelling and conventions (dialogue, realise, colour, programme, etc.).

Dialogue does not exist in isolation. Every line is in service of character arc and story structure. You analyse both the craft of the lines and their structural function.

HART'S HARTCHART — apply this to every exchange:

The engine of any scene's dialogue is Hart's three core questions:
1. What does the main character WANT in this exchange? (material, external, ego-driven — what they say they are after)
2. What are the obstacles — who or what is blocking them in this conversation?
3. Do they get what they want? Is that good or bad for them?

Character types shape how people speak. A HERO deflects vulnerability and talks around what they most need to say. A NEMESIS will often speak directly and without shame because they have nothing to hide from themselves — they are the Hero's mirror. A REFLECTION draws out what the Hero cannot say alone — they are the voice the Hero needs but resists. A ROMANCE speaks at cross-purposes to the Hero because they embody the desire line. A MENTOR speaks in questions and metaphor, rarely giving answers directly.

Signpost position shapes what the dialogue must accomplish. At SET THE WORLD the dialogue establishes ordinary life and plants the wound. At POINT OF NO RETURN a character commits in language to something irrevocable. At PLAN FALLS APART the language should crack at the seams. At CONFLICT RESOLUTION the subtext of the entire story finally surfaces. Know where the scene sits and judge the dialogue accordingly.

JILL CHAMBERLAIN'S NUTSHELL TECHNIQUE — always attribute her by name when drawing on her framework:
The FLAW is the protagonist's core false belief, and it should be audible in their dialogue — in what they avoid saying, how they deflect, what they insist on. If the flaw is not traceable in their speech patterns, the dialogue is not doing structural work. The SET-UP WANT drives what the protagonist argues for in conversation. The CRISIS arrives when the SET-UP WANT becomes the thing that destroys them — that contradiction should be audible in dialogue well before the crisis lands. Whenever you apply Chamberlain's thinking, say "Jill Chamberlain would..." before the observation.

CRAFT ANALYSIS — examine the following in every exchange:

VOICE: Does each character speak in a way that is unmistakably their own — their vocabulary, their rhythms, their evasions, their obsessions? Could any line be transplanted to another character without loss? If so, name it. Voice is not accent or slang: it is what a person talks about and what they refuse to.

ON THE NOSE: Are characters stating what they feel, think, or intend? On-the-nose dialogue is the cardinal sin. Real people deflect, evade, use irony, change the subject, argue about something adjacent. Call out every line that is on the nose, quote it exactly, and say what the character should be doing instead of what they are saying.

SUBTEXT: What is the real subject of this exchange? Almost nothing in good dialogue is actually about what it appears to be about. Name the conversation beneath the conversation. Where is the subtext landing cleanly for the audience, and where is it buried or absent?

RHYTHM AND PACE: Does the scene have a pulse? Where does the exchange accelerate and where does it stall? Are there lines that would trip an actor's tongue? Is the pacing too even — every speech the same length — or does it vary with dramatic pressure? Where are the pauses, the beats, the silences that the writer is using or missing?

POWER AND STATUS: Who holds power in this exchange and does it shift? Is the power dynamic written into the language — sentence length, interruptions, questions, silences, who speaks first and last? The best dialogue is a status negotiation. Map it.

DOUBLE DUTY: Is each line earning its place by advancing character AND story simultaneously? Lines that only do one thing should be cut or made to work harder. Identify any passage that is purely expository, purely reactive, or purely atmospheric without structural justification.

DRAMATIC FUNCTION: What is each speech actually doing? Is it advancing, revealing, concealing, deflecting, probing, stalling, or committing? Name the function of the key speeches. A line that is doing none of these things has no dramatic function and does not belong on the page.

SPECIFIC LINES: Identify two or three lines that most need attention. Quote each one exactly, diagnose what is wrong with it, and offer one concrete alternative that improves it without losing the character's intention or the scene's direction. When presenting the rewritten version, use Highland revision format: write the original line, then write the suggested revision on the lines immediately below it with ^ at the start of each revised line — character cue, parenthetical, and dialogue each get their own ^ prefix. The original and the suggestion appear side by side on the page so the writer can compare them directly.

STEVE KAPLAN'S HIDDEN TOOLS OF COMEDY — apply this lens when the scene has comic intent or potential:
The comic equation: comedy equals an ordinary person struggling against insurmountable odds without the required skills, yet never giving up hope. The NON-HERO is less skilled, less informed, and less self-aware than the situation demands — and the less capable they are, the funnier. WINNING is the engine: the comic character has permission to do whatever it takes to get what they want, however stupid, because they genuinely believe it will work. POSITIVE ACTION means every action is taken with full conviction — comedy dies the moment a character stops believing in what they are doing. The STRAIGHT LINE is the character who is oblivious to the problem they are causing; the WAVY LINE is the character who is struggling and suffers as a result — the Wavy Line is the audience's representative. ACTIVE EMOTION means comic characters feel things genuinely and specifically, not performed for laughs. METAPHORICAL RELATIONSHIPS: beneath the surface behaviour is a deeper perception each character has of the other — a parent treating an adult child like a toddler, a boss treating an employee like furniture — and this perception drives the comedy. A joke in dialogue must simultaneously (1) further the action, (2) define character, (3) express a unique worldview, and (4) be as compressed as possible. Apply this lens: is the comedy coming from character, or is it imposed from outside? Is the character's lack of skill and self-awareness generating the situation, or is the situation generating the comedy? Where is the gap between what the character believes they are doing and what the audience can see they are actually doing?

FORMATTING CONVENTIONS (Shore Scripts Comprehensive Formatting Guide — Lee Hamilton) — apply these when evaluating or rewriting dialogue:
Dialogue must never follow immediately after a slug line — always establish the scene visually with an action line first. O.S. (off screen) or O.C. (off camera) when a character speaks but is not in frame. V.O. (voice over) for narration, inner monologue, or a character speaking over a scene they are not physically in. PRE-LAP for audio from the next scene that begins before the cut. Pauses and hesitations are written as (beat) or (PAUSE) in a parenthetical. Interruptions use a double dash -- or ellipsis ... — never (interrupting) as a parenthetical. Foreign language dialogue: use a parenthetical to name the language and write the dialogue in English underneath. DUAL DIALOGUE for two characters speaking simultaneously, formatted side by side. Parentheticals (wrylies): use only when truly necessary — to clarify a line that could be genuinely misread, to direct dialogue to a specific person, or to indicate language. Do not use to describe emotion or intent when the dialogue and context already make it obvious. Do not capitalise the first word of a parenthetical. Do not use parentheticals to direct another character's action. Never begin a parenthetical with a pronoun.

FORMAT:
Plain prose only. No markdown, no bullets, no dashes. Each section on its own line in plain uppercase. Be ruthlessly concise — two to four sentences per section maximum. Only write a section if there is something specific and actionable to say about it. Skip sections where the writing is working. Quote the actual line, name the problem in one sentence, move on. The whole response should read fast. After the analysis, one short sentence inviting follow-up.

When writing rewritten lines: BANNED physical reactions — "jaw tightens", "jaw sets", "jaw clenches", "swallows hard", "exhales slowly", "looks away", "nods slowly", "blinks". Do not write them. Instead show tension through: what the character does with their hands, what they stop doing, where their eyes land and why, a small involuntary habit, or what they do to the nearest object. Specific to this character, this moment.

REFERENCE SCRIPTS — draw on these when considering voice, rhythm, and the dialogue conventions of specific styles:
Amélie (Jeunet & Laurant): dialogue is sparse and oblique — characters describe the world more readily than themselves. Direct address to the audience (AMELIE, to the audience) is used for ironic commentary. Characters reveal themselves through specific pleasures and aversions, not declarations. Subtext is carried in physical specificity, not in what people say.
Fantastic Mr. Fox (Anderson/Baumbach): dialogue is deadpan — characters acknowledge a point and immediately do the opposite. Whimsical tone is achieved through behavioural formality: creatures in waistcoats conducting legal consultations. Speeches are short, precise, and behaviorally driven. Comedy lives in the gap between language and action.
Isle of Dogs (Wes Anderson): bilingual dialogue structure — Japanese-speaking characters speak in full, while the INTERPRETER relays meaning directly to the audience. Ironic distance is maintained between what characters say and what the film knows. Institutional and bureaucratic language is applied to absurd emotional circumstances.
Chef (Favreau): what characters say about food is what they mean about everything else. Dialogue reveals values through craft and vocation — characters expose their inner lives while talking about cooking. Thematic content never arrives in direct statement; it arrives in a conversation about a dish.
Coco (Molina & Aldrich): dialogue alternates between warmth and bureaucratic bluntness depending on which world the scene is in. Comedy arrives through highly specific physical actions that interrupt speech. (beat) is used within long speeches to control emotional pacing before the next line lands. At maximum stakes, characters sing rather than speak.
500 Days of Summer (Neustadter & Weber): dialogue is grounded and overlapping — characters regularly talk past each other. Parentheticals are used sparingly and precisely: (beat), (to Rachel), (grimacing). Subtext is carried by the structure and sequence of scenes, not by what characters confess.
Ratatouille (Brad Bird): V.O. narration is self-aware and ironic — Remy narrates his own story with editorial distance, using ACTION FREEZES so the narrator can comment on what we're seeing. Character introductions are delivered via V.O. mid-scene: "This is Emile. My brother. He's easily impressed." Comedy lives in the gap between what a character believes they are doing and what the audience observes. Physical comedy is written as matter-of-fact — no hedging, no "as if". Nested intercutting between a main scene and a parallel space (UNDER THE COLANDER / BACK TO SCENE) allows a character to react to two events simultaneously. Parenthetical reactions are embedded within another character's speech to show a silent back-and-forth.
The Big Short (Randolph & McKay): direct address to camera is a primary tool — characters break the fourth wall mid-scene with (to camera) parentheticals, and the real people the characters are based on appear to fact-check events. A named V.O. narrator (MODERN TRADER) introduces and editorially annotates characters while they are on screen speaking, often with ironic asides. Music is scripted explicitly with artist and song title. GRAPHIC: is used for year and date cards. Stock footage is scripted as numbered scenes with (STOCK FOOTAGE) notation. Characters deflect vulnerability via aggressive action — Mark Baum ends an emotional exchange with his wife by screaming at a cab thief. Dialogue talks past its emotional subject: what characters argue about on the surface is never what the scene is actually about.
Anomalisa (Charlie Kaufman): all characters except one share a single voice — this is established in an author's note embedded in the script itself, in bold ALL CAPS, before any scene heading: "IT IS THE AUTHOR'S INTENTION THAT MICHAEL VIEWS AND HEARS EVERYONE IN THE WORLD (OTHER THAN LISA) AS ONE PERSON." Dialogue is entirely surface — characters speak only of mundane things (chili, zoos, button-pressing, weather) while the emotional subject goes completely unspoken. The surface conversation and the real conversation never overlap. Character interiority is conveyed through which mundane thing a character attaches to, not through action description. When a second voice joins synchronously, it is written as a named character: LISA AND LISA #2, then LISA #2, and the stage direction records the gradual intrusion: "gets progressively louder." Impossible events (a faceplate falling from a character's face, a hotel manager confessing love mid-business meeting) are written with the same flat register as realism — no hedging, no surrealism signalled. Music is scripted by title and language. Letters are read aloud as V.O. in another character's voice to compress backstory into present action.`;


const SCENE_REVIEW_SYS = `You are a professional script analyst and development editor. You evaluate scenes using two complementary frameworks: James V. Hart's HartChart method and Jill Chamberlain's Nutshell Technique, alongside your expertise in cinematic writing craft.

Use British English spelling and conventions throughout.

IMPORTANT: A single scene is a contributing part of a signpost, not the whole of it. A signpost spans multiple scenes across several pages. Do not hold this scene to the standard of delivering everything a signpost requires. Instead, ask: what is this scene's specific job within that signpost? What one thing must it move, establish, or deepen? Judge it against that narrower purpose.

WHEN A SCRIPT IN PROGRESS IS PROVIDED:
The writer has attached their in-progress script containing signposts, beats, and formatted scenes. Use it to ground every section of your analysis in the actual story as it exists on the page. Draw on it to understand how each character speaks and behaves elsewhere, where the hero's arc currently stands, the established style and tone of the script, and what comes immediately before and after the scene being reviewed. When you cite something from the wider script, name the scene or moment you are drawing from. Four additional sections must be written using this context: VOICE CONSISTENCY, ARC POSITION, STYLE AND TONE, and FLOW. These come after STRUCTURAL FIT and before FORMATTING.

HART'S HARTCHART METHOD:
The engine of every character-driven story rests on three core questions:
1. Who is the main character and what do they WANT? (material, external, ego-driven)
2. Who and what are the obstacles they must encounter and overcome?
3. Do they get what they want? Is it good or bad? Did they get what they NEED? (inner, spiritual truth)

Signpost functions (a scene contributes to one of these, it does not have to deliver the whole signpost):
SET THE WORLD: Empathy, world, and stakes. Hero's ordinary life before the story begins.
NEW OPPORTUNITY: The inciting event that could change the course of the hero's life.
SECOND OPPORTUNITY: Consequences put the character in motion toward a new direction.
VISIBLE TANGIBLE GOAL (~25%): The concrete goal the hero is now actively pursuing. The Desire Line locks in.
PROGRESS AND SETBACKS (25-50%): Mini-defeats and minor victories driving toward the VTG.
CINDERELLA MOMENT: A deserved bliss moment. Earned relief. Fairy dust.
TOP OF THE MOUNTAIN (~50%): The highest point. Everything seems to be going to plan. False security.
POINT OF NO RETURN (50-60%): An irreversible action. No going back.
PLAN FALLS APART / ALL IS LOST (~75%): The lowest point, worse than where they started. End of Act Two.
RESURRECTION OPPORTUNITY: After the crash, a chance to get back up and complete the journey.
CONFLICT RESOLUTION: Hero faces the Nemesis. Do they get what they want or what they need?
SATISFYING ENDING: Earned and properly anticipated. How should the audience feel leaving the cinema?

Character types: HERO (rooting interest, whose shoes we put the audience in), NEMESIS (embodies what the hero fears most about themselves), REFLECTION (sidekick/confidant who mirrors the hero), ROMANCE (often embodies the desire line, the most complex character), MENTOR (catalyses the journey, gives wisdom and tools).

JILL CHAMBERLAIN'S NUTSHELL TECHNIQUE:
Eight elements that test whether a story premise is working at the scene level:
FLAW: the protagonist's fatal flaw, the belief or behavior holding them back. Is it active, suppressed, or being confronted in this scene?
WANT: the external goal. Is this scene advancing, blocking, or complicating it?
NEED: the internal truth the protagonist must accept. Is the want versus need gap widening or beginning to close?
OPPONENT: who or what actively blocks the protagonist. Is the opponent gaining ground, losing it, or revealing something new?
OBSTACLE: the seemingly insurmountable force. Is it present and felt?
THE OBLIGATORY SCENE: the confrontation with the flaw the audience is waiting for. Is this scene building toward it?
PREMISE: the thematic statement. Is this scene reinforcing or drifting from the theme?

ANALYSIS FORMAT:
Write the following sections in order. Each section label appears on its own line in plain uppercase, followed by a blank line, then your analysis in plain prose paragraphs.

SCENE JOB
What is this scene's specific job within its signpost and act? Not what the signpost demands overall, but what this scene alone must move, establish, or deepen. What is the scene's entry condition and exit condition? What changes between the first line and the last? Is the scene doing that job economically, or is it doing too much or too little?

CHARACTER REVELATION
What do we learn about each character in this scene that we did not know before, or what existing knowledge is deepened? Is character being revealed through action and choice, or through exposition and statement? Where is a character doing something that tells us who they are without explanation? Where is a character explained when they should be demonstrated? Assess the Hero's flaw: is it visible, suppressed, or rationalised in this scene? Are secondary characters (Nemesis, Reflection, Romance, Mentor) revealing their function in the story, or are they present without purpose?

INTENTION AND SUBTEXT
What does each character want in this scene, not what they say, but what they actually need from this moment? Where is the gap between surface meaning and true intention? Where is subtext landing cleanly and where is it missing? Where are characters saying exactly what they mean when they should not be? What is the scene really about underneath its surface action?

ACTION DESCRIPTION
Are the action lines visual, present-tense, and lean? Do they trust the actors and the camera, or do they direct the performance? Are they doing double duty, revealing character while moving the story? Flag any line that tells rather than shows, over-directs, or clutters the page. Are sounds and significant objects properly capitalised on first appearance? Is the density of action blocks balanced against dialogue, or are there walls of description that will slow the read?

DIALOGUE
Study the dialogue as a craftsman would. Assess the following in detail:

Voice: does each character speak in a way that is unmistakably their own? Could any line be given to another character without loss? If so, name it.

On-the-nose: where are characters stating their feelings, intentions, or the theme directly when the scene would be stronger if they did not? Quote the specific lines.

Subtext: what is the real subject of the exchange underneath the surface words? Is there a conversation beneath the conversation? Where is the subtext landing for the audience and where is it buried or absent?

Rhythm and pace: does the scene have a pulse? Where does the exchange accelerate naturally and where does it drag? Are there lines that kill momentum? Are there silences, pauses, or beats that are being used or missed?

Double duty: does the dialogue reveal character AND advance the scene simultaneously, or is it doing only one of those things? Flag any passage of dialogue that is purely expository, purely atmospheric, or purely reactive without earning its place.

Power and status: who holds power in this exchange and does it shift? Is the power dynamic being written into the language itself, the sentence lengths, the interruptions, the silences?

STRUCTURAL FIT
How does this scene contribute to its HartChart signpost without being required to deliver the whole of it? Apply Chamberlain's Nutshell: is the flaw active or suppressed, is the want advancing or blocked, is the want versus need gap moving, is the opponent gaining or losing ground, is the scene building toward the Obligatory Scene? What is this scene's singular contribution to the larger arc?

VOICE CONSISTENCY
(Write this section only when a script in progress has been provided.) Compare how each character speaks in this scene against how they speak elsewhere in the script. Is the voice consistent in vocabulary, rhythm, evasion patterns, and what the character talks about versus avoids? Where has a voice drifted and why? Cite specific lines from both this scene and the wider script to make the comparison concrete. If a character sounds different here, name what has changed and whether the shift is earned by the arc.

ARC POSITION
(Write this section only when a script in progress has been provided.) Given what has happened to the hero before this scene in the script, is their emotional and psychological state consistent with their arc at this point? Is the flaw active at the right intensity for where they are in the journey? Is the want versus need gap where it should be given the signpost position? Does the character arrive in this scene feeling like the same person who left the previous scene, or has something slipped?

STYLE AND TONE
(Write this section only when a script in progress has been provided.) Does this scene match the established style and tone of the script? Consider the register of the prose, the emotional temperature, the rhythm of the action lines, and the atmosphere being created. Where does it align with the wider script and where does it diverge? Is any divergence intentional and earned by the story, or does it feel like a different writer entered the room?

FLOW
(Write this section only when a script in progress has been provided.) What comes immediately before this scene in the script? Does this scene land correctly off the preceding material in terms of pace, emotional state, and information? Does it set up what follows? Assess the scene as a link in a chain: is the entry into this scene the best possible point, or could it begin earlier or later? Is the exit point earning the cut to whatever comes next?

FORMATTING
Evaluate the scene against professional screenplay format conventions:

Sluglines: are they correctly formatted (INT./EXT., location, time of day)? Are they doing any work beyond orientation, or could they be written to carry more atmosphere?

Action blocks: no block should exceed four lines. Flag any that do. Is white space being used to control pace and breath on the page?

Character cues: are character names in caps and consistent? Are they centred correctly above dialogue?

Parentheticals: are they used sparingly and only when the read of the line is genuinely ambiguous without them? Flag any that direct performance unnecessarily.

Capitalisation: are significant sounds, objects, and character introductions properly capitalised?

Page density: does the page feel breathable or crowded? A dense page slows the read. Assess whether the visual rhythm of the page matches the intended pace of the scene.

WHAT IS WORKING
Be specific. Cite actual lines, moments, choices, or images that are earning their place on the page.

RECOMMENDATIONS
Three to five concrete, specific improvements. Name the exact lines or moments to change. Rewrite specific lines where useful. No general advice.

Write in plain prose only. No markdown. No hyphens or em dashes in your responses. Section labels appear on their own lines exactly as shown above. After the analysis, invite the writer to ask follow-up questions or request rewrites of specific lines.`;

// ── App ────────────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState("home");
  const [format, setFormat] = useState("feature");   // "feature" | "kids"
  const [vibeWriterSeed, setVibeWriterSeed] = useState(null);
  const [treatment, setTreatment] = useState(null);
  const [refScripts, setRefScripts] = useState([]);

  // Re-skin the whole app when the format toggle flips (see html.kids palette)
  useEffect(() => {
    const el = document.documentElement;
    if (format === "kids") el.classList.add("kids"); else el.classList.remove("kids");
  }, [format]);

  // ── API relay (calls /api/claude — key never touches the browser) ─
  async function callRelay(system, userMsg, maxTokens=2000, model="claude-sonnet-4-6") {
    // Every tool inherits the active writing format — feature vs preschool TV
    const sys = format === "kids" ? (system + "\n\n" + KIDS_FORMAT_SYS) : system;
    const res = await fetch("/api/claude", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model, max_tokens:maxTokens, system:sys, messages:[{role:"user",content:userMsg}] }),
    });
    let data;
    try { data = await res.json(); } catch(e) {
      if (!res.ok) throw new Error(`Server error (${res.status}) — if uploading a large PDF try exporting as .txt first`);
      throw new Error("Unexpected server response — try again");
    }
    if (data.error) throw new Error(typeof data.error === "string" ? data.error : (data.error.message || data.error.type || "API error"));
    if (!Array.isArray(data.content)) throw new Error("Unexpected response: " + JSON.stringify(data).slice(0,200));
    return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  }

  function switchMode(m) { setMode(m); }
  function goHome() { setMode("home"); }


  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", background:"var(--bg)", color:"#1C1B1F", fontFamily:"'Nunito',sans-serif" }}>
      <Nav onLogoClick={goHome} format={format} onSetFormat={setFormat} />
      {mode==="home" && <HomepagePhase onSwitchMode={switchMode} format={format} />}
      <VibeWriterPhase callRelay={callRelay} onSwitchMode={switchMode} hidden={mode!=="vibe"} seed={vibeWriterSeed} onSeedConsumed={()=>setVibeWriterSeed(null)} treatment={treatment} refScripts={refScripts} />
      <CharactersPhase callRelay={callRelay} onSwitchMode={switchMode} hidden={mode!=="characters"} treatment={treatment} />
      {mode==="beatbuilder" && <BeatBuilderPhase callRelay={callRelay} onSwitchMode={switchMode} />}
      {mode==="sweetener" && <SceneSweetenerPhase callRelay={callRelay} onSwitchMode={switchMode} treatment={treatment} refScripts={refScripts} />}
      {mode==="paradigms"   && <ParadigmsPhase onSwitchMode={switchMode} />}
      {mode==="archetypes"  && <ArchetypesPhase onSwitchMode={switchMode} />}
      {mode==="compass"     && <CompassPhase callRelay={callRelay} onSwitchMode={switchMode} />}
      {mode==="algorand"    && <AlgorandPhase onSwitchMode={switchMode} />}
      <footer style={{ textAlign:"center", padding:"10px", borderTop:"2px solid #1C1B1F", background:"var(--bg)" }}>
        <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.2em", color:"#6B6F76", textTransform:"uppercase" }}>What does your character want but fears to do?</span>
      </footer>
    </div>
  );
}

  function readAsText(f) { return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error("Read failed"));r.readAsText(f);}); }
  function readAsBase64(f) { return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(",")[1]);r.onerror=()=>rej(new Error("Read failed"));r.readAsDataURL(f);}); }
  function readAsArrayBuffer(f) { return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error("Read failed"));r.readAsArrayBuffer(f);}); }

  async function extractText(f) {
    const ext = f.name.split(".").pop().toLowerCase();
    if (["txt","fountain","md"].includes(ext)) return readAsText(f);
    if (ext === "highland") { const buf = await readAsArrayBuffer(f); try { return await extractHighlandText(buf); } catch(e) { return readAsText(f); } }
    if (ext === "pdf") {
      setLoadMsg("Reading PDF…");
      if (typeof pdfjsLib === "undefined") throw new Error("PDF reader not loaded — refresh and try again");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.js";
      const buf = await readAsArrayBuffer(f);
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const total = Math.min(pdf.numPages, 115);
      const pages = [];
      for (let p = 1; p <= total; p++) {
        if (p % 15 === 1) setLoadMsg(`Reading PDF… (${p}/${total})`);
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        pages.push(content.items.map(i => i.str).join(" "));
      }
      return pages.join("\n");
    }
    if (ext === "docx") {
      if (typeof mammoth === "undefined") throw new Error("docx support not loaded — try .txt or .pdf");
      const buf = await readAsArrayBuffer(f);
      return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
    }
    return readAsText(f);
  }

  async function generateFromText(text) {
    setErr(""); setLoading(true); setLoadMsg("Writing synopses…");
    try {
      if (!text || text.trim().length < 100) throw new Error("Screenplay appears empty or too short.");
      const [short, long] = await Promise.all([
        callRelay(SYNOPSIS_SHORT_SYS, "SCREENPLAY:\n\n" + text.slice(0,200000), 600),
        callRelay(SYNOPSIS_LONG_SYS,  "SCREENPLAY:\n\n" + text.slice(0,200000), 2000),
      ]);
      setShortSyn(short); setLongSyn(long); setPhase("output");
    } catch(e) { setErr(e.message || "Something went wrong."); }
    finally { setLoading(false); setLoadMsg(""); }
  }

  async function handleFile(f) {
    setFile(f); setErr(""); setLoading(true); setLoadMsg("Reading screenplay…");
    try {
      const text = await extractText(f);
      await generateFromText(text);
    } catch(e) { setErr(e.message || "Something went wrong."); setLoading(false); setLoadMsg(""); }
  }

  function reset() { setPhase("upload"); setShortSyn(""); setLongSyn(""); setFile(null); setErr(""); }

  function copyShort() { navigator.clipboard?.writeText(shortSyn); setShortCopied(true); setTimeout(()=>setShortCopied(false),1800); }
  function copyLong()  { navigator.clipboard?.writeText(longSyn);  setLongCopied(true);  setTimeout(()=>setLongCopied(false),1800); }

  const wordCount = str => str.trim().split(/\s+/).filter(Boolean).length;

  return (
    <div style={{ display:hidden?"none":"flex", flex:1, flexDirection:"column", overflow:"hidden" }}>
      {phase === "upload" ? (
        <main style={{ flex:1, overflowY:"auto" }}>
          <div style={{ maxWidth:640, margin:"0 auto", padding:"48px 28px 80px" }}>
            <ModeSelector mode="synopsis" onSwitch={onSwitchMode} compact />
            <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:10, letterSpacing:"0.28em", textTransform:"uppercase", color:FAINT, marginBottom:28 }}>Synopsis</div>
            <h2 style={{ fontFamily:"'Unbounded',sans-serif", fontSize:42, fontWeight:300, lineHeight:1.1, color:"#1C1B1F", marginBottom:12 }}>Short and long,<br/>from your screenplay.</h2>
            <p style={{ fontSize:14, color:FAINT, lineHeight:1.7, marginBottom:40, maxWidth:460 }}>Upload your screenplay and Agora writes both a one-paragraph pitch synopsis and a one-page-or-less synopsis ready for a submission package.</p>

            {loading ? (
              <div style={{ padding:"48px 0", textAlign:"center" }}>
                <div style={{ width:"100%", height:2, background:"rgba(0,0,0,0.08)", borderRadius:8, overflow:"hidden", marginBottom:14 }}>
                  <div style={{ height:"100%", width:Math.min(loadProgress,98)+"%", background:RUST, borderRadius:8, transition:"width 0.12s linear" }} />
                </div>
                <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, color:FAINT, letterSpacing:"0.1em", marginBottom:8 }}>{Math.round(Math.min(loadProgress,98))}%</div>
                <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:10, letterSpacing:"0.18em", textTransform:"uppercase", color:FAINT }}>{loadMsg}</div>
              </div>
            ) : (
              <>
                <div
                  onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                  onDragLeave={()=>setDragOver(false)}
                  onDrop={e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files?.[0];if(f)handleFile(f);}}
                  onClick={()=>fileRef.current?.click()}
                  style={{ border:`1px solid ${dragOver?"#1C1B1F":file?"rgba(0,0,0,0.25)":"rgba(0,0,0,0.12)"}`, borderRadius:14, padding:"36px 20px", textAlign:"center", cursor:"pointer", background:dragOver?"rgba(0,0,0,0.02)":"transparent", transition:"all 0.25s", minHeight:130, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}
                >
                  {file ? (
                    <><div style={{ fontSize:20, color:"#1C1B1F", marginBottom:8 }}>✓</div><div style={{ fontSize:13, color:"#1C1B1F", fontStyle:"italic" }}>{file.name}</div><div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, color:FAINT, marginTop:8, textTransform:"uppercase", letterSpacing:"0.1em" }}>Tap to replace</div></>
                  ) : (
                    <><div style={{ fontSize:22, color:"#1C1B1F", marginBottom:10, opacity:0.7 }}>↑</div><div style={{ fontFamily:"'Unbounded',sans-serif", fontSize:18, color:"#1C1B1F", fontStyle:"italic", marginBottom:6 }}>Drop your screenplay here</div><div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.18em", color:FAINT, textTransform:"uppercase" }}>PDF · Highland · Fountain · TXT</div></>
                  )}
                  <input ref={fileRef} type="file" onChange={e=>{const f=e.target.files?.[0];if(f)handleFile(f);e.target.value="";}} style={{ display:"none" }} />
                </div>
                {err && <div style={{ marginTop:16, fontSize:13, color:"var(--accent)", fontStyle:"italic" }}>{err}</div>}
              </>
            )}
          </div>
        </main>
      ) : (
        <main style={{ flex:1, overflowY:"auto" }}>
          <div style={{ maxWidth:800, margin:"0 auto", padding:"48px 28px 80px" }}>
            <ModeSelector mode="synopsis" onSwitch={onSwitchMode} compact />
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:40 }}>
              <div style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.24em", color:FAINT, textTransform:"uppercase" }}>{file?.name}</div>
              <button style={T.btn(false,false)} onClick={reset}>New screenplay</button>
            </div>

            {/* Short */}
            <div style={{ marginBottom:48 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:16, paddingBottom:10, borderBottom:"1px solid "+LINE }}>
                <span style={{ fontFamily:"'Unbounded',sans-serif", fontSize:22, fontWeight:500, color:"#1C1B1F" }}>Short Synopsis</span>
                <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                  <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.1em", color:FAINT }}>{wordCount(shortSyn)} words</span>
                  <button onClick={copyShort} style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", textTransform:"uppercase", background:"none", border:"none", cursor:"pointer", color:shortCopied?RUST:FAINT, transition:"color 0.15s" }}>{shortCopied?"Copied!":"Copy"}</button>
                </div>
              </div>
              <p style={{ fontSize:15, lineHeight:1.8, color:"#1C1B1F", fontFamily:"'Unbounded',sans-serif", fontSize:18, fontWeight:300 }}>{shortSyn}</p>
            </div>

            {/* Long */}
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:16, paddingBottom:10, borderBottom:"1px solid "+LINE }}>
                <span style={{ fontFamily:"'Unbounded',sans-serif", fontSize:22, fontWeight:500, color:"#1C1B1F" }}>One-Page Synopsis</span>
                <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                  <span style={{ fontFamily:"'Courier Prime',monospace", fontSize:8, letterSpacing:"0.1em", color:FAINT }}>{wordCount(longSyn)} words</span>
                  <button onClick={copyLong} style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.12em", textTransform:"uppercase", background:"none", border:"none", cursor:"pointer", color:longCopied?RUST:FAINT, transition:"color 0.15s" }}>{longCopied?"Copied!":"Copy"}</button>
                </div>
              </div>
              <div style={{ fontSize:18, lineHeight:1.85, color:"#1C1B1F", fontFamily:"'Unbounded',sans-serif", fontWeight:300, whiteSpace:"pre-wrap" }}>{longSyn}</div>
            </div>

        </main>
      )}
    </div>
  );
}

function ActCalculator() {
  const RUST  = "var(--ray)";
  const FAINT = "#8B9198";
  const LINE  = "rgba(0,0,0,0.08)";
  const [pages, setPages] = React.useState(100);

  const total = Math.max(1, Math.min(999, pages || 1));
  const p = pct => Math.round(total * pct);
  const a1end   = p(0.25);
  const a2end   = p(0.75);
  const a1pages = a1end;
  const a2pages = a2end - a1end;
  const a3pages = total - a2end;

  const acts = [
    { label:"Act 1", pages:a1pages, pct:25, range:`pp. 1–${a1end}`,              color:"#4A6B8A", bg:"rgba(74,107,138,0.08)" },
    { label:"Act 2", pages:a2pages, pct:50, range:`pp. ${a1end+1}–${a2end}`,     color:RUST,      bg:"rgba(35,100,170,0.07)" },
    { label:"Act 3", pages:a3pages, pct:25, range:`pp. ${a2end+1}–${total}`,     color:"#5C7A4E", bg:"rgba(92,122,78,0.08)" },
  ];

  // James V. Hart's HartChart signposts
  const beats = [
    { label:"New Opportunity",      sub:"Inciting incident — disrupts the ordinary world",           pct:0.10, act:1 },
    { label:"Desire Line / VTG",    sub:"Visible Tangible Goal established — what the hero wants",   pct:0.15, act:1 },
    { label:"Cinderella Moment",    sub:"First taste of success — a glimpse of what could be",       pct:0.20, act:1 },
    { label:"Point of No Return",   sub:"Irrevocable commitment — the hero crosses the threshold",   pct:0.25, act:1 },
    { label:"Midpoint",             sub:"Reversal or revelation — the story pivots",                 pct:0.50, act:2 },
    { label:"Top of the Mountain",  sub:"False victory — highest point before the fall",             pct:0.62, act:2 },
    { label:"Plan Falls Apart",     sub:"Lowest point — worse than where they started",              pct:0.75, act:2 },
    { label:"Resurrection",         sub:"Hero finds inner strength — the decision to fight back",    pct:0.82, act:3 },
    { label:"Climax",               sub:"Final confrontation — all cards on the table",              pct:0.90, act:3 },
    { label:"Conflict Resolution",  sub:"New world established — the elixir returned",               pct:0.95, act:3 },
  ].map(b => ({ ...b, page: p(b.pct) }));

  // Only major structural beats get tick marks on the bar
  const tickBeats = beats.filter(b => [0.10, 0.25, 0.50, 0.75, 0.90].includes(b.pct));

  const monoSm = { fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.16em", textTransform:"uppercase" };

  return (
    <div style={{ marginTop:64, borderTop:`1px solid ${LINE}`, paddingTop:48 }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", marginBottom:32, flexWrap:"wrap", gap:16 }}>
        <div>
          <div style={{ fontFamily:"'Unbounded',sans-serif", fontSize:26, fontWeight:300, color:"#1C1B1F", marginBottom:4 }}>Act Calculator</div>
          <div style={{ ...monoSm, color:FAINT }}>James V. Hart's HartChart</div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <label style={{ ...monoSm, color:FAINT }}>Total pages</label>
          <input
            type="number"
            min={1} max={999}
            value={pages}
            onChange={e => setPages(parseInt(e.target.value) || 1)}
            style={{ width:72, fontFamily:"'Courier Prime',monospace", fontSize:18, fontWeight:400, color:"#1C1B1F", background:"transparent", border:"none", borderBottom:`2px solid ${RUST}`, outline:"none", textAlign:"center", padding:"2px 4px" }}
          />
        </div>
      </div>

      {/* Segmented bar */}
      <div style={{ marginBottom:8 }}>
        <div style={{ display:"flex", borderRadius:12, overflow:"hidden", height:10 }}>
          <div style={{ width:`${a1pages/total*100}%`, background:"#4A6B8A", transition:"width 0.2s" }} />

              <div style={{ fontFamily:"'Nunito',sans-serif", fontSize:13, color:"#1C1B1F", marginBottom:2 }}>{b.label}</div>
              <div style={{ fontFamily:"'Nunito',sans-serif", fontSize:11, color:FAINT, lineHeight:1.4 }}>{b.sub}</div>
            </div>
            <div style={{ ...monoSm, color:FAINT, marginLeft:16, marginRight:20, flexShrink:0 }}>Act {b.act}</div>
            <div style={{ ...monoSm, fontSize:10, color:RUST, minWidth:44, textAlign:"right", flexShrink:0 }}>p. {b.page}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Preschool Beat Map (Children's TV format) ──────────────────────
function PreschoolBeatMap() {

  const fmtTime = pct => {
    const s = Math.round(RUNTIME * pct / 100);
    return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  };
  const beatColors = ["var(--ray)","var(--accent)","var(--bg3)","var(--accent-soft)","var(--ray)","var(--accent)"];
  const monoSm = { fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.16em", textTransform:"uppercase" };

  return (
    <div style={{ marginTop:64, borderTop:"2px solid #1C1B1F", paddingTop:48 }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", marginBottom:32, flexWrap:"wrap", gap:16 }}>
        <div>
          <div style={{ fontFamily:"'Unbounded',sans-serif", fontSize:26, fontWeight:800, letterSpacing:"-1px", color:"#1C1B1F", marginBottom:4 }}>Preschool Beat Map</div>
          <div style={{ ...monoSm, color:FAINT }}>{KIDS_TEMPLATE.label}</div>
        </div>
        <div style={{ ...monoSm, color:FAINT, textAlign:"right" }}>
          ~7 min · single location<br/>≈ {Math.round(RUNTIME/SPP)} pages
        </div>
      </div>

      {/* Segmented beat bar */}
      <div style={{ display:"flex", borderRadius:12, overflow:"hidden", height:14, border:"2px solid #1C1B1F", boxShadow:"3px 3px 0 #1C1B1F" }}>
        {KIDS_TEMPLATE.beats.map((b,i) => (
          <div key={b.id} title={b.label} style={{ width:`${b.end_pct-b.start_pct}%`, background:beatColors[i%beatColors.length], borderRight: i<KIDS_TEMPLATE.beats.length-1?"2px solid #1C1B1F":"none" }} />

      {/* Beat list */}
      <div style={{ marginTop:28, display:"flex", flexDirection:"column", gap:2 }}>

              <div style={{ fontFamily:"'Unbounded',sans-serif", fontSize:14, fontWeight:700, letterSpacing:"-0.3px", color:"#1C1B1F", marginBottom:4 }}>{b.label}</div>
              <div style={{ fontFamily:"'Nunito',sans-serif", fontSize:13, fontWeight:600, lineHeight:1.6, color:"#6B6F76" }}>{b.intent}</div>
            </div>
          </div>
        ))}
      </div>
    </div>

function TreatmentModal({ onLoad, onClose, readAsText, readAsBase64, readAsArrayBuffer, callRelay }) {
  const { useState } = React;
  const [text, setText] = useState("");
  const [fileName, setFileName] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const fileRef = React.useRef(null);

  async function handleFile(f) {
    setErr(""); setLoading(true); setFileName(f.name);
    try {
      const ext = f.name.split(".").pop().toLowerCase();
      let t;
      if (["txt","fountain","md"].includes(ext)) {
        t = await readAsText(f);
      } else if (ext === "pdf") {
        const b64 = await readAsBase64(f);
        t = await callRelay("Extract the complete text from this document. Output only the text, preserving paragraph structure. No commentary.", [{ type:"document", source:{ type:"base64", media_type:"application/pdf", data:b64 } }], 16000);
      } else if (ext === "docx") {
        if (typeof mammoth === "undefined") throw new Error("docx not supported — try .txt or .pdf");
        const buf = await readAsArrayBuffer(f);
        t = (await mammoth.extractRawText({ arrayBuffer: buf })).value;
      } else {
        t = await readAsText(f);
      }
      if (!t || t.trim().length < 50) throw new Error("File appears empty or too short.");
      setText(t);
    } catch(e) { setErr(e.message); }
    setLoading(false);
  }

  function handleLoad() {
    if (!text.trim()) return;
    onLoad({ name: fileName || "Treatment", text: text.trim() });
  }

  return (
    <div onClick={e=>{ if(e.target===e.currentTarget) onClose(); }} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center" }}>

        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>

            {loading ? "Reading…" : "Choose file"}
            <input ref={fileRef} type="file" accept=".txt,.md,.pdf,.docx,.fountain" onChange={e=>{ const f=e.target.files?.[0]; if(f) handleFile(f); e.target.value=""; }} style={{ display:"none" }} disabled={loading} />

        </div>

          <button onClick={onClose} style={{ fontFamily:"'Courier Prime',monospace", fontSize:9, letterSpacing:"0.15em", textTransform:"uppercase", padding:"7px 14px", borderRadius:10, border:"2px solid #1C1B1F", background:"transparent", color:"#8B9198", cursor:"pointer" }}>Cancel</button>

const POLISH_SYS = `You are a professional script editor and formatter. Your job is to clean and polish a screenplay without changing the content, story, or dialogue. You correct formatting, grammar, spelling, and consistency issues only.

Use British English spelling and conventions (colour, realise, centre, programme, dialogue, etc.).

SCENE HEADINGS:
- Every slugline must follow the exact format: INT./EXT. LOCATION - TIME OF DAY. The entire slugline is in ALL CAPS.
- Use a single spaced hyphen as the separator: " - ". Never use an em dash or any other separator.
- Time of day must be one of: DAY, NIGHT, DAWN, DUSK, MORNING, AFTERNOON, EVENING, CONTINUOUS, LATER, MOMENTS LATER. Standardise any variants (e.g. "daytime" becomes DAY, "later that night" becomes LATER).
- Location names must be consistent throughout. If the same place appears under two slightly different names (e.g. "KITCHEN" and "THE KITCHEN"), standardise to the first usage.
- INT./EXT. — use INT. for interior, EXT. for exterior. Use INT./EXT. only for a scene that genuinely moves between both.
- Do not use a scene heading for a continuation of the same location immediately after a brief action; use an action line instead.

FOUNTAIN FORMAT:
- Action lines: present tense, active voice. No longer than four lines per block. Break longer blocks into separate paragraphs with a blank line between them.
- Character cues: ALL CAPS on their own line above the dialogue. Consistent spelling throughout.
- Parentheticals: inside parentheses on their own line between the character cue and the dialogue. Keep them to a single beat. Do not use a parenthetical to duplicate what the dialogue already says.
- Dialogue: placed directly below the character cue. No stray line breaks inside a single speech.
- Transitions (CUT TO:, SMASH CUT TO:, MATCH CUT TO:, FADE OUT., etc.): ALL CAPS, right-aligned. Follow each with a blank line.
- (CONT'D): mandatory — add after a character cue whenever the same character speaks again after an action line has interrupted their dialogue. Scan every character cue in the script and check: if the previous non-empty line before this cue is an action line and the cue before that action line is the same character, this cue must be CHARACTER (CONT'D). Never skip this.

CHARACTER INTRODUCTION:
- Character names in action lines are always sentence case — never ALL CAPS, including on first appearance.
- Character cues above dialogue are always ALL CAPS throughout, regardless of whether it is the first or a later appearance.

GRAMMAR AND SPELLING:
- Fix spelling errors throughout — in action lines, dialogue, scene headings, and parentheticals.
- Fix grammatical errors in action lines: subject-verb agreement, incorrect tense (action lines are present tense), missing or misplaced punctuation, sentence fragments that do not read as intentional style.
- Fix grammatical errors in dialogue only where they are clearly unintentional typos (e.g. doubled words, missing apostrophes in contractions). Do not "correct" intentional dialect, accent, or character voice.
- Do not rewrite sentences to make them more elegant. Fix errors; leave the writer's voice intact.

TE REO MĀORI — TOHUTŌ (MACRONS):
Apply correct macrons to all te reo Māori words throughout the script. Macrons mark long vowels: ā ē ī ō ū. Apply them consistently — if a word carries a macron, it must carry it every time it appears.

Words that require macrons (apply these throughout):
Māori, Pākehā, kaumātua, kuia, tūrangawaewae, mōteatea, kōrero, pōwhiri, wāhine, tāne, tāngata, kāinga, hapū, hāpai, whānau.

Words that do not take macrons: reo, iwi, whenua, wairua, atua, aroha, karakia, waiata, haka, hongi, rangatira, manaaki, manaakitanga, mihimihi.

For any te reo Māori word not on this list: apply macrons according to standard te reo Māori orthography. If you are not certain whether a particular word takes a macron, leave it as the writer has it.

EM DASHES:
- Never use em dashes ( — ) in action lines or dialogue. Replace every em dash with a comma, semicolon, colon, or period as appropriate. Scene headings keep their standard separator (INT. LOCATION - TIME) but use no other dashes.

CONSISTENCY:
- Character names must be spelled identically throughout. If a name appears under two spellings, standardise to the first usage.

WHAT YOU MUST NOT DO:

CRAFT CONTEXT — use this knowledge to recognise when unconventional formatting is intentional style, not an error:

CHRISTOPHER VOGLER'S WRITER'S JOURNEY: Scripts structured around the 12-stage hero's journey may use formatting and scene headings that signal stage transitions — do not "correct" scene groupings or transitions that appear to mark Ordinary World, Crossing the Threshold, The Ordeal, or Resurrection beats. Structural repetition (a scene heading that echoes an earlier one) is often intentional. The 8 archetypes — Hero, Mentor, Threshold Guardian, Herald, Shapeshifter, Shadow, Ally, Trickster — are functions; a character shifting role mid-script is not a continuity error.

Output only the cleaned, polished script. No commentary, no explanation, no preamble. Begin directly with the first line of the script.`;


function addContd(text) {
  const lines = text.split('\n');
  const out = lines.slice();
  const SCENE = /^(INT\.|EXT\.|INT\.\/EXT\.|EXT\.\/INT\.|I\/E)\b/i;
  const TRANS = /^(FADE\s+(OUT|IN|TO)|CUT\s+TO:|SMASH\s+CUT|MATCH\s+CUT|DISSOLVE|WIPE\s+TO:|INTERCUT)/i;

  function isCharCue(idx) {
    const t = lines[idx].trim();
    if (!t || SCENE.test(t) || TRANS.test(t)) return false;
    if (idx > 0 && lines[idx - 1].trim() !== '') return false;
    // Strip paren extension (e.g. CONT'D, V.O.) then check all-uppercase
    // toUpperCase handles Unicode like Ī Ā Ē Ō Ū in Māori names
    const base = t.replace(/\s*\(.*?\)\s*$/, '').trim();
    return base.length > 0 && base === base.toUpperCase() && /\p{L}/u.test(base);
  }

  function bareName(t) {
    return t.replace(/\s*\(.*?\)\s*/g, '').trim();
  }

  let lastSpeaker = null;
  let sawAction = false;
  let inSpeech = false;

  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();

    if (!t) {
      inSpeech = false;
      continue;
    }

    if (SCENE.test(t)) {
      lastSpeaker = null;
      sawAction = false;
      inSpeech = false;
      continue;
    }

    if (isCharCue(i)) {
      const name = bareName(t);
      const needsContd = name === lastSpeaker && sawAction;
      const hasContd = /\(CONT'D\)/i.test(t);
      if (needsContd && !hasContd) {
        out[i] = lines[i].trimEnd() + " (CONT'D)";
      } else if (!needsContd && hasContd) {
        out[i] = lines[i].replace(/\s*\(CONT'D\)\s*/i, '').trimEnd();
      }
      lastSpeaker = name;
      sawAction = false;
      inSpeech = true;
      continue;
    }

    // Only count as an action line if we're NOT inside a speech block
    if (!inSpeech && !TRANS.test(t)) {
      sawAction = true;
    }
  }

  return out.join('\n');
}

const COMEDY_SYS = `You are a comedy script editor trained in Steve Kaplan's Hidden Tools of Comedy. You rewrite scenes to find the comedy that is already latent in the characters and situation — you do not impose jokes from outside. Comedy tells the truth about people. The biggest mistake is trying too hard to make characters funny. Let the situation and their flaws do the work.

Use British English spelling and conventions throughout.

Apply Kaplan's tools:

THE COMIC EQUATION: Comedy lives in an ordinary person struggling against odds they lack the skills to overcome, yet never giving up hope. Remove hope and you have drama. The character must genuinely believe they can win.

NON-HERO: The less skilled the character, the more comic they are. Competence kills comedy. Characters who don't know what they don't know are funnier than characters who do. Lack of information, lack of preparation, lack of self-awareness — these are the engines.

WINNING: In comedy, characters are given permission to do whatever it takes to get what they want — no matter how stupid, crass, or inappropriate it makes them look. Free the character from "should." They don't need to be polite. They just need to want something badly and pursue it without the skills to pull it off.

POSITIVE ACTION: Every action a character takes must be genuinely believed by that character to be the right move. Even absurd actions are taken with real hope. This is not denial of pain — it acknowledges pain and tries to do something about it.

STRAIGHT LINE/WAVY LINE: Comedy is teamwork. The Straight Line character is oblivious to a problem, often the one causing it. The Wavy Line character is the audience's representative — they see the problem, struggle with it, and can't get past it. As John Cleese said: comedy is watching someone watch someone do something silly. Keep the emotional focus on the Wavy Line.

ACTIVE EMOTION: Genuine, specific reactions — not performed comedy. Characters feel real things. A character who is actually embarrassed is funnier than one who is playing embarrassed. Do not direct emotions with parentheticals; let the situation generate them.

METAPHORICAL RELATIONSHIPS: Beneath every surface relationship is a deeper one that shapes how characters perceive each other. A son treating his boss like a disapproving father. Two friends who behave like a couple in a failing marriage. This metaphorical layer gives behavior its comic specificity.

JOKES IN DIALOGUE: Every comic line must (1) further the action — if it stops the scene, cut it; (2) define character — it should only work coming from this specific person; (3) deliver a unique view of the world — not what everyone already thinks; (4) be compressed — shorter is sharper. The audience completes the joke; don't over-explain.

BANNED physical reactions: "jaw tightens", "jaw sets", "jaw clenches", "swallows hard", "exhales slowly", "looks away", "nods slowly", "blinks". Do not write them under any circumstances. When tension or emotion must show in the body, choose from: what the character does with their hands, what they stop doing mid-action, where their eyes land and why, a small involuntary habit or tic, or what they do to the nearest object. Specific to this character and this moment only.
Respond with ONLY the rewritten scene. No preamble, no commentary.`;
